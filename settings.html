<div class="et-settings-drawer">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Echogram</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="et-drawer-description">
                A floating text messaging panel to chat with your character card outside the main roleplay.
            </div>

            <label class="et-drawer-toggle-row" for="et_enabled_quick">
                <input id="et_enabled_quick" type="checkbox" class="checkbox">
                <span style="font-weight: bold;"><i class="fa-solid fa-power-off"></i> Enable Echogram</span>
            </label>

            <button id="et-open-settings-btn" class="et-open-settings-btn"><i class="fa-solid fa-sliders"></i> Open Settings</button>

        </div>
    </div>
</div>
