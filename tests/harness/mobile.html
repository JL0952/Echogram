<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>Mobile panel test</title>
<link rel="stylesheet" href="build/vendor/css/fontawesome.min.css">
<link rel="stylesheet" href="build/vendor/css/solid.min.css">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../mobile-style.css">
<style>
    /* SillyTavern's mobile-styles.css pins the body */
    body { position: fixed; inset: 0; overflow: hidden; margin: 0; background: #222; }
</style>
</head><body>
<div id="host"></div>
<script src="build/vendor/jquery-3.5.1.min.js"></script>
<script src="build/vendor/purify.min.js"></script>
<script>window.SillyTavern = { libs: { DOMPurify: window.DOMPurify } };</script>
<script src="../../lib/rich-messages.js"></script>
<script src="../../lib/features.js"></script>
<script src="../../lib/chat-view-model.js"></script>
<script src="../../platforms/echotext/platform.js"></script>
<script src="../../platforms/wechat/platform.js"></script>
<script src="scenarios.js"></script>
<script>
// ?old: the committed index.js (sh tests/harness/build.sh builds it as bundle-chrome-old.js)
document.write(`<script src="build/bundle-chrome${location.search.includes('old') ? '-old' : ''}.js"><\/script>`);
</script>
<script>
// The EchoText panel as a phone shows it: in #et-portal on <html>, full screen
// (mobile-style.css), on a pinned body. Open it on a phone or the iOS Simulator.
// "⋯" on a message edits it straight away (no menu); sending adds a message and
// keeps the input focused, as EchoText does. Every "+" panel open / close and
// every click is reported to the server (serve.py prints POST /__log).
const params = new URLSearchParams(location.search);
const sleep = ms => new Promise(res => setTimeout(res, ms));
const report = data => fetch('/__log', { method: 'POST', body: JSON.stringify(data) }).catch(() => {});
const sc = window.EchoTextScenarios[0];
const history = JSON.parse(JSON.stringify(sc.history));
const env = { settings: { ...sc.settings, autoScroll: true, defaultPlatform: params.get('platform') || 'wechat' }, groupManager: null,
    FA_REACTIONS: window.EchoTextScenarioReactions, showTypingIndicator: false, BASE_URL: '', VERSION_QUERY: '',
    getCurrentCharacter: () => ({ name: 'Mira', avatar: 'mira.png' }), getCharacterName: () => 'Mira', isTetheredMode: () => true,
    getUserName: () => '我', getCharacterKey: () => 'mira.png', getCharAvatarUrl: () => null, _pickerAvatarBg: () => '#7c6f9c',
    isMobileDevice: () => true, getChatHistory: () => history, getUserAvatarUrl: () => null, isCombinedGroupMode: () => false,
    closeAllDotMenus: () => jQuery('.et-dots-menu').remove(), closeAllReactOverlays: () => {},
    panelOpen: true, saveSettings: () => {}, saveChatHistory: () => {}, refreshMessages: h => r.renderMessages(h),
    toggleDotsMenu: (btn, msgIndex) => r.startInlineEdit(history, msgIndex) };
const r = window.EchoTextHarness[params.has('old') ? 'chromeOld' : 'chrome'](env);

const portal = document.createElement('div');
portal.id = 'et-portal';
portal.style.cssText = 'position:fixed; top:0; left:0; width:100dvw; height:100dvh; z-index:2147483647; pointer-events:none; display:block !important; border:none !important; margin:0 !important; padding:0 !important;';
document.documentElement.appendChild(portal);
document.getElementById('host').innerHTML = r.buildPanelHtml();
portal.appendChild(document.getElementById('et-panel'));
jQuery('#et-panel').attr('data-et-scheme', params.get('scheme') || 'light');
r.bindAttachPanel();
r.bindMessageActions();
r.renderMessages(history);

// Sending, as EchoText's handleSend: the message goes in, the input empties and keeps focus
const send = () => {
    const input = jQuery('#et-input');
    const text = String(input.val()).trim();
    if (!text) return;
    input.val('').css('height', 'auto');
    // In voice mode (the voice button) the text goes as a voice message
    const mes = r.isVoiceButtonMode && r.isVoiceButtonMode() ? `<voice>${text}</voice>` : text;
    history.push({ is_user: true, mes, send_date: Date.now() });
    r.renderMessages(history);
    // ... and the character answers a moment later, three bubbles (one a voice message) revealed one by one
    setTimeout(() => {
        history.push({ is_user: false, mes: `收到：${text}\n<voice>好，我现在在路上，我在扶着外公，在外面。我一会儿看一下，我仔细看一下，我再问他们。你先别管了啊，你先睡觉啊。</voice>\n第三条，稍微长一点的消息`, send_date: Date.now() });
        r.renderMessages(history);
    }, 1500);
};
jQuery('#et-send-btn').on('click', send);
jQuery('#et-input').on('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
jQuery('#et-voice-btn').on('click', function (e) {
    e.stopPropagation();
    r.setComposeMode(r.isVoiceButtonMode() ? null : 'voice');
    document.getElementById('et-input').focus();
});
jQuery('#et-attach-btn').on('click', function (e) {
    e.stopPropagation();
    // ?keepfocus: the input keeps focus (and the keyboard stays up) through a "+" tap, as a webview may
    if (params.has('keepfocus')) document.getElementById('et-input').focus();
    r.toggleAttachMenu(jQuery(this));
});

// Per frame while the "+" panel moves: how far the last message sits above the
// input bar (constant when they move together), where the bar is, the viewport
const vv = window.visualViewport;
const bar = document.querySelector('[data-et-role~="input-bar"]');
const lastMsg = () => [...document.querySelectorAll('#et-messages-inner [data-et-role~="message"]')].pop();
const frame = () => ({ gap: Math.round(bar.getBoundingClientRect().top - lastMsg().getBoundingClientRect().bottom),
    bar: Math.round(bar.getBoundingClientRect().top), vvH: Math.round(vv.height), vvTop: Math.round(vv.offsetTop),
    focus: document.activeElement?.id || document.activeElement?.tagName });
const watchPanel = async (what) => {
    const frames = [frame()];
    let on = true;
    const tick = () => { frames.push(frame()); if (on) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    await sleep(900);
    on = false;
    const gaps = frames.map(f => f.gap);
    report({ what, spread: Math.max(...gaps) - Math.min(...gaps), frames });
};
new MutationObserver(records => {
    for (const rec of records) {
        for (const n of rec.addedNodes) if (n.id === 'et-attach-panel') watchPanel('panel open');
        if (rec.type === 'attributes' && rec.target.matches('.et-attach-panel') && rec.oldValue === 'et-attach-panel') watchPanel('panel close');
    }
}).observe(document.getElementById('et-panel'), { childList: true, subtree: true, attributes: true, attributeFilter: ['id'], attributeOldValue: true });

// Where each click lands, against where the tapped element is drawn
document.addEventListener('click', e => {
    const t = e.target;
    const rect = t.getBoundingClientRect();
    report({ what: 'click', x: Math.round(e.clientX), y: Math.round(e.clientY),
        target: `${t.tagName}.${[...t.classList].join('.')}${t.dataset.etRole ? `[${t.dataset.etRole}]` : ''}`,
        rect: [Math.round(rect.left), Math.round(rect.top), Math.round(rect.right), Math.round(rect.bottom)], vvTop: Math.round(vv.offsetTop), vvH: Math.round(vv.height) });
}, true);
vv.addEventListener('resize', () => report({ what: 'viewport', vvH: Math.round(vv.height), vvTop: Math.round(vv.offsetTop), innerH: innerHeight, scrollY }));
report({ what: 'loaded', ua: navigator.userAgent, innerH: innerHeight, vvH: Math.round(vv.height) });
</script>
</body></html>
