<script>
/*
 * The character's social account (docs/platform-plan.md 17a) through the real code:
 * lib/social.js, the X theme, and index.js's way in (the avatar menu, WeChat's "+" panel).
 *   ?view=profile (default) | detail | empty | edit | compose   shows that page for a screenshot
 *   ?platform=echotext | wechat | instagram     the chat look underneath
 *   runSocialTest(), runEditTest(), runFrameTest(), runComposeTest(), runScriptedTest(), runPhotoTest(), runPinTest(), runPostEditTest(), runRepostTest()   the checks
 */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const params = new URLSearchParams(location.search);
const NOW = new Date(2026, 10, 8, 21, 30).getTime();
const H = 3600000, D = 24 * H;

function picture(colors) {
    const c = document.createElement('canvas');
    c.width = c.height = 120;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 120, 120);
    g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]);
    x.fillStyle = g; x.fillRect(0, 0, 120, 120);
    return c.toDataURL();
}
const AVATAR = picture(['#5b4a8a', '#c98ab0']);

const REPLY_NAMES = ['夜猫子', 'Kev_in', 'lurker_404', '吃瓜群众', 'nightowl', '阿杰', 'Sora', 'mmm_ok', '路过的', 'ghost_reader', 'Late', 'zz'];
function mockSettings() {
    return {
        socialAccounts: {
            'mira.png': {
                theme: 'x', pinnedId: 'pin1', name: 'm.', handle: 'mira_after_dark', bio: '晚上才上线\n不认识的别加 / no DMs',
                followers: 23800, following: 312,
                posts: [{ id: 'pin1', at: NOW - 40 * D, text: '新号，旧号被人认出来了。', image: '', likes: 88, reposts: 2, views: 4100, replyCount: 6,
                    replies: [{ name: 'Sora', handle: 'sora_k', text: '欢迎回来', likes: 3, at: NOW - 39 * D }] }],
            },
        },
        socialPosts: {
            'mira.png': [
                { id: 'a', at: NOW - 2 * H, text: '今天又在他面前装了一整天没事人。\n回家路上绕了两站，就为了多看一眼他家楼下那盏灯。', image: '', likes: 2400, reposts: 312, views: 128000, replyCount: 2400,
                    replies: REPLY_NAMES.map((name, i) => ({ name, text: i === 0 ? '姐你这是暗恋吧' : i === 1 ? 'just tell him lol' : `第 ${i + 1} 条回复 <b>不该加粗</b>`, likes: 900 - i * 70, at: NOW - 2 * H + (i + 1) * 60000 })) },
                { id: 'b', at: NOW - 5 * D, text: '周末的展。', image: '美术馆白墙前一幅很大的蓝色抽象画，地上是她的影子', likes: 640, reposts: 41, views: 15300, replyCount: 3,
                    replies: [{ name: '阿杰', text: '这是哪个馆', likes: 2, at: NOW - 5 * D + H }] },
                { id: 'c', at: NOW - 20 * D, text: 'hot take: 便利店的关东煮比大部分餐厅好吃', image: '', likes: 0, reposts: 0, views: 0, replyCount: 0, replies: [] },
            ],
        },
    };
}

const platform = params.get('platform') || 'echotext';
const history = JSON.parse(JSON.stringify(window.EchoTextScenarios[0].history));
let saves = 0;
const modelRequests = [];
const env = {
    settings: { ...window.EchoTextScenarios[0].settings, ...mockSettings(), autoScroll: true, defaultPlatform: platform },
    groupManager: null, FA_REACTIONS: window.EchoTextScenarioReactions, showTypingIndicator: false, BASE_URL: '../..', VERSION_QUERY: '',
    getCurrentCharacter: () => ({ name: 'Mira', avatar: 'mira.png', description: 'Mira, 26, works the night desk at a hotel.', personality: 'Guarded, dry, secretly soft.' }),
    // The model, stubbed: each request recorded, answered with window.__answer (a string or a promise)
    sendCompletionRequest: (params) => { modelRequests.push(params); return Promise.resolve(window.__answer); },
    stripThinkingTags: text => String(text).replace(/<think>[\s\S]*?<\/think>/g, ''),
    replaceMacros: text => text, expandTimeDateMacros: text => text,
    getActiveWorldInfoEntries: async () => 'The night market by the river opens at 10pm.', getCharacterName: () => 'Mira', isTetheredMode: () => true,
    getUserName: () => '我', getCharacterKey: () => 'mira.png', _pickerAvatarBg: () => '#7c6f9c',
    isMobileDevice: () => false, getChatHistory: () => history, getUserAvatarUrl: () => null, isCombinedGroupMode: () => false,
    closeAllDotMenus: () => jQuery('.et-dots-menu').remove(), panelOpen: true, saveSettings: () => { saves++; },
    pickImageFile: () => Promise.resolve(window.__nextFile || null),
};
// The crop dialog and the image endpoints, stubbed: uploads get a picture of their own as their path
const crops = [];
const imageRequests = [];
let failUpload = false;
window.SillyTavern.getContext = () => ({
    getThumbnailUrl: () => AVATAR, POPUP_TYPE: { CROP: 5 }, getRequestHeaders: () => ({ 'Content-Type': 'application/json' }),
    callGenericPopup: async (content, type, input, opts) => { crops.push(opts.cropAspect); return type === 5 ? opts.cropImage : null; },
});
const realFetch = window.fetch.bind(window);
window.fetch = async (url, init) => {
    if (!String(url).startsWith('/api/images/')) return realFetch(url, init);
    const body = JSON.parse(init.body);
    imageRequests.push([url, body.filename ? body.filename.replace(/\d+$/, 'N') : body.path]);
    if (url === '/api/images/upload') {
        if (failUpload) return { ok: false, status: 500, json: async () => ({}) };
        return { ok: true, json: async () => ({ path: window.__uploadPath || `user/images/Mira/${body.filename}.jpg` }) };
    }
    return { ok: true, json: async () => ({}) };
};
async function imageFile(w, h, color) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, w, h);
    return new File([await new Promise(res => c.toBlob(res, 'image/png'))], 'pic.png', { type: 'image/png' });
}
const r = window.EchoTextHarness.chrome(env);
document.getElementById('host').innerHTML = r.buildPanelHtml();
r.bindAttachPanel();
r.bindMessageActions();
r.renderMessages(history);
r.syncPlatformChrome();

// The page alone, as lib/social.js draws it, for checks on mock data
function view(settings) {
    return window.EchoTextSocial.createSocialView({
        getSettings: () => settings, getCharacterKey: () => 'mira.png', getCharacterName: () => 'Mira',
        getAvatarUrl: () => AVATAR, getContainer: () => document.getElementById('et-panel'),
        stylesheetUrl: (theme, file) => `../../social/${theme}/${file}`, now: () => NOW,
    });
}

window.runSocialTest = async function () {
    const res = {};
    const root = () => document.querySelector('#et-panel .et-social');
    const texts = sel => [...root().querySelectorAll(sel)].map(e => e.textContent.trim());

    // Data
    const S = window.EchoTextSocial;
    const settings = mockSettings();
    const posts = S.getPosts(settings, 'mira.png');
    res.postsNewestFirst = posts.map(p => p.id).join(',') === 'a,b,c,pin1';
    res.pinnedMarked = posts.find(p => p.id === 'pin1').pinned === true && posts.filter(p => p.pinned).length === 1;
    res.repliesCapped = posts[0].replies.length === 5 && posts[0].replyCount === 2400;
    const blank = S.getAccount({}, 'Lawrence Wu.png', { name: '劳伦斯' });
    res.defaults = blank.name === '劳伦斯' && blank.handle === 'LawrenceWu' && blank.theme === 'x' && blank.followers === 0;
    res.handleFromChinese = /^user\d+$/.test(S.getAccount({}, '劳伦斯.png', { name: '劳伦斯' }).handle);
    res.formats = [S.timeAgo(NOW - 30000, NOW), S.timeAgo(NOW - 3 * H, NOW), S.timeAgo(NOW - 2 * D, NOW), S.timeAgo(NOW - 20 * D, NOW), S.timeAgo(new Date(2025, 0, 3).getTime(), NOW)].join(' ')
        === '1m 3h 2d Oct 19 Jan 3, 2025';
    res.counts = [S.shortCount(980), S.shortCount(2400), S.shortCount(128000), S.shortCount(1300000), S.shortCount(1574, 10000), S.shortCount(23800, 10000)].join(' ') === '980 2.4K 128K 1.3M 1,574 23.8K';
    res.fullTime = S.fullTime(new Date(2026, 10, 8, 15, 4).getTime()) === '3:04 PM · Nov 8, 2026';

    // The profile
    const v = view(settings);
    v.open();
    await sleep(300);
    res.overPanel = !!root() && getComputedStyle(root()).position === 'absolute' && root().getBoundingClientRect().height === document.getElementById('et-panel').clientHeight;
    res.topBar = texts('.x-topbar-name')[0] === 'm.' && texts('.x-topbar-sub')[0] === '4 posts';
    res.header = texts('.x-profile-handle')[0] === '@mira_after_dark' && texts('.x-profile-follows span').join('|') === '312 Following|23.8K Followers';
    res.bioLines = root().querySelector('.x-profile-bio').textContent.includes('\n');
    res.cards = root().querySelectorAll('.x-feed .x-post').length === 4 && texts('.x-post-pinned').join() === 'Pinned';
    res.pinnedFirst = root().querySelector('.x-feed .x-post:first-child').getAttribute('data-post-id') === 'pin1';
    res.cardMeta = texts('.x-feed .x-post[data-post-id="a"] .x-post-meta')[0] === '@mira_after_dark · 2h';
    res.cardCounts = texts('.x-feed .x-post[data-post-id="a"] .x-action-count').join(' ') === '2.4K 312 2.4K 128K';
    res.noCountsWhenZero = root().querySelectorAll('.x-feed .x-post[data-post-id="c"] .x-action-count').length === 0;
    res.photoCard = texts('.x-media-text')[0] === '美术馆白墙前一幅很大的蓝色抽象画，地上是她的影子';
    res.avatar = root().querySelector('.x-profile-avatar').getAttribute('src') === AVATAR;
    res.onlyPostsTab = texts('.x-tab-active').join() === 'Posts';
    {
        const tabs = [...root().querySelectorAll('.x-tab')];
        res.tabIcons = tabs.map(t => t.getAttribute('aria-label')).join() === 'Posts,Replies,Reposts,Likes' && tabs.every(t => t.querySelector('svg.x-icon path')?.getAttribute('d'))
            && tabs.slice(1).every(t => !t.textContent.trim());
        const face = root().querySelector('.x-profile-avatar');
        const box = face.getBoundingClientRect();
        const hit = document.elementFromPoint(box.left + box.width / 2, box.top + 12);
        res.avatarOverBanner = hit === face || face.contains(hit);
    }

    // A post's page and back
    root().querySelector('.x-feed .x-post[data-post-id="a"]').click();
    await sleep(50);
    res.detail = texts('.x-topbar-name')[0] === 'Post' && texts('.x-status-time')[0] === '7:30 PM · Nov 8, 2026';
    res.detailReplies = root().querySelectorAll('.x-replies .x-reply').length === 5;
    res.replyingTo = texts('.x-reply-to')[0] === 'Replying to @mira_after_dark';
    res.replyEscaped = !root().querySelector('.x-replies b') && texts('.x-replies .x-post-text')[2].includes('<b>');
    res.replyFallback = !!root().querySelector('.x-reply .x-avatar-fallback') && root().querySelector('.x-reply .x-avatar-fallback').textContent === '夜';
    root().querySelector('[data-social-action="back"]').click();
    await sleep(50);
    res.backToProfile = !!root().querySelector('.x-profile');
    root().querySelector('[data-social-action="back"]').click();
    await sleep(50);
    res.backCloses = !root();

    // No posts yet
    const empty = view({});
    empty.open();
    await sleep(50);
    res.empty = texts('.x-empty-title')[0] === '@mira hasn’t posted';
    res.emptyCount = texts('.x-topbar-sub')[0] === '0 posts';
    empty.close();

    // The way in: the avatar menu on Echogram and Instagram, "+" on WeChat
    const menuItems = () => [...document.querySelectorAll('.et-avatar-menu .et-dots-item')].map(b => b.dataset.avatar);
    const setPlatform = async id => { env.settings.defaultPlatform = id; await sleep(0); r.renderMessages(history); r.syncPlatformChrome(); await sleep(50); };
    for (const id of ['echotext', 'instagram']) {
        await setPlatform(id);
        r.openAvatarMenu(document.querySelector('#et-panel .et-avatar, #et-panel [data-et-action="avatar"]') || document.getElementById('et-panel'));
        await sleep(50);
        const item = document.querySelector('.et-avatar-menu [data-avatar="social"]');
        res[`menu_${id}`] = !!item && item.textContent.trim() === 'X' && !!item.querySelector('i.fa-brands.fa-x-twitter');
        item?.click();
        await sleep(100);
        res[`menuOpens_${id}`] = !!root() && !!root().querySelector('.x-profile');
        r.closeSocial();
        jQuery('.et-dots-menu').remove();
    }
    await setPlatform('wechat');
    r.openAvatarMenu(document.getElementById('et-panel'));
    await sleep(50);
    res.wechatMenuWithout = !menuItems().includes('social');
    jQuery('.et-dots-menu').remove();
    r.toggleAttachPanel();
    await sleep(300);
    const tile = document.querySelector('#et-attach-panel [data-et-social]');
    res.wechatTile = !!tile && tile.textContent.trim() === 'X' && tile === document.querySelector('#et-attach-panel .et-attach-panel-item:last-child');
    tile?.click();
    await sleep(300);
    res.wechatTileOpens = !!root() && !document.getElementById('et-attach-panel')?.classList.contains('et-attach-panel-open');
    r.closeSocial();

    res.allPass = Object.values(res).every(v => v === true);
    return res;
};

/**
 * Edit profile (17b) through index.js's real openSocial and pickSocialImage: the fields,
 * the counters, a new avatar and banner (cropped, uploaded on Save), taking them off,
 * Escape and back, a failed upload, and defaults left unset.
 */
window.runEditTest = async function () {
    const res = {};
    const panel = document.getElementById('et-panel');
    const modal = () => panel.querySelector('.et-social-modal');
    const field = name => modal().querySelector(`[data-social-field="${name}"]`);
    const click = async (sel, wait = 50) => { (modal() || panel).querySelector(sel).click(); await sleep(wait); };
    const typeInto = (name, value) => { const el = field(name); el.value = value; el.dispatchEvent(new Event('input', { bubbles: true })); };
    const stored = () => env.settings.socialAccounts['mira.png'];
    env.settings.defaultPlatform = 'echotext';
    await sleep(0);
    r.syncPlatformChrome();
    env.settings.socialAccounts = mockSettings().socialAccounts;
    r.openSocial();
    await sleep(200);

    // Opens with the account's values
    {
        const page = panel.querySelector('.et-social');
        const banner = page.querySelector('.x-banner').getBoundingClientRect();
        const more = page.querySelector('.x-banner [data-social-action="edit"]').getBoundingClientRect();
        res.moreOnBanner = Math.abs(banner.right - more.right - 8) < 1 && Math.abs(more.top - banner.top - 8) < 1;
        res.noEditLabel = !page.textContent.includes('Edit profile') && page.querySelectorAll('[data-social-action="edit"]').length === 1;
    }
    await click('.et-social [data-social-action="edit"]');
    res.opens = !!modal() && modal().getBoundingClientRect().height === panel.clientHeight;
    res.values = [field('name').value, field('handle').value, field('bio').value, field('followers').value, field('following').value].join('|')
        === 'm.|mira_after_dark|晚上才上线\n不认识的别加 / no DMs|23800|312';
    res.counters = modal().querySelector('[data-social-count="name"]').textContent === '2' && !modal().querySelector('[data-social-count="handle"]');
    {
        // A SillyTavern theme's rules for every input (the user's own, 2026-11-08): the field stays one box
        const themeRules = document.createElement('style');
        themeRules.textContent = 'input[type="text"], input:not([type]), textarea:not([type="search"]) { background-color: #363636 !important; border: 1px solid #363636 !important; }'
            + ' input[type="text"]:focus, textarea:not([type="search"]):focus { border: 1px solid #a6f !important; } textarea:focus-visible { outline: 1px solid #a6f !important; }';
        document.head.appendChild(themeRules);
        const oneBox = el => { const g = getComputedStyle(el); return g.backgroundColor === 'rgba(0, 0, 0, 0)' && g.borderTopWidth === '0px' && g.outlineStyle === 'none'; };
        res.oneBoxTyped = oneBox(field('name')) && oneBox(field('bio')) && oneBox(field('postingStyle'));
        field('bio').focus();
        await sleep(20);
        res.oneBoxFocused = oneBox(field('bio'));
        field('bio').blur();
        themeRules.remove();
    }
    res.styleBlank = field('postingStyle').value === '' && field('postingStyle').tagName === 'TEXTAREA';
    typeInto('postingStyle', '  posts in English  ');
    typeInto('name', 'Mira 的小号');
    res.counterFollows = modal().querySelector('[data-social-count="name"]').textContent === '8';
    res.ownAvatarDrop = !modal().querySelector('[data-social-action="edit-avatar-drop"]');

    // A new avatar and banner: cropped square and 3:1, shown before Save, what's typed kept
    window.__nextFile = await imageFile(900, 900, '#c33');
    await click('[data-social-action="edit-avatar"]', 400);
    window.__nextFile = await imageFile(1800, 600, '#3a7');
    await click('[data-social-action="edit-banner"]', 400);
    res.cropped = crops.join(',') === '1,3';
    res.previews = modal().querySelector('.x-edit-avatar-img').getAttribute('src').startsWith('data:image/jpeg') && modal().querySelector('.x-edit-banner img')?.getAttribute('src').startsWith('data:image/jpeg');
    res.typedKept = field('name').value === 'Mira 的小号';
    res.nothingUploadedYet = imageRequests.length === 0 && !stored().avatar;
    // The load event, not decode(): decode waits for a frame, which a hidden window never draws
    const bannerImg = new Image();
    await new Promise((res, rej) => { bannerImg.onload = res; bannerImg.onerror = rej; bannerImg.src = modal().querySelector('.x-edit-banner img').getAttribute('src'); });
    res.bannerSize = `${bannerImg.naturalWidth}x${bannerImg.naturalHeight}` === '1500x500';

    // Save: uploaded, kept, the profile redrawn
    typeInto('handle', '@New Handle!');
    typeInto('followers', '1,200');
    typeInto('following', '');
    const savesBefore = saves;
    await click('[data-social-action="edit-save"]', 300);
    res.uploads = JSON.stringify(imageRequests) === JSON.stringify([['/api/images/upload', 'echogram-social-avatar-N'], ['/api/images/upload', 'echogram-social-banner-N']]);
    const st = stored();
    res.stored = st.name === 'Mira 的小号' && st.handle === 'NewHandle' && st.followers === 1200 && !('following' in st)
        && /echogram-social-avatar-\d+\.jpg$/.test(st.avatar) && /echogram-social-banner-\d+\.jpg$/.test(st.banner) && st.posts.length === 1 && st.theme === 'x';
    res.saved = saves === savesBefore + 1 && !modal();
    res.styleSaved = st.postingStyle === 'posts in English';
    const page = panel.querySelector('.et-social');
    res.redrawn = page.querySelector('.x-profile-name').textContent === 'Mira 的小号' && page.querySelector('.x-profile-handle').textContent === '@NewHandle'
        && page.querySelector('.x-banner img')?.getAttribute('src') === st.banner && page.querySelector('.x-profile-avatar').getAttribute('src') === st.avatar
        && page.querySelector('.x-profile-follows').textContent.replace(/\s+/g, ' ').trim() === '0 Following 1,200 Followers';

    // Back to Echogram's avatar, banner off: the old files deleted after Save
    imageRequests.length = 0;
    await click('.et-social [data-social-action="edit"]');
    res.dropShown = !!modal().querySelector('[data-social-action="edit-avatar-drop"]') && !!modal().querySelector('[data-social-action="edit-banner-drop"]');
    const oldAvatar = st.avatar, oldBanner = st.banner;
    await click('[data-social-action="edit-avatar-drop"]');
    await click('[data-social-action="edit-banner-drop"]');
    res.styleShown = field('postingStyle').value === 'posts in English';
    res.dropPreview = modal().querySelector('.x-edit-avatar-img').getAttribute('src') === AVATAR && !modal().querySelector('.x-edit-banner img');
    await click('[data-social-action="edit-save"]', 200);
    res.dropped = !stored().avatar && !stored().banner && JSON.stringify(imageRequests) === JSON.stringify([['/api/images/delete', oldAvatar], ['/api/images/delete', oldBanner]]);
    res.echogramAvatar = panel.querySelector('.et-social .x-profile-avatar').getAttribute('src') === AVATAR && !panel.querySelector('.et-social .x-banner img');

    // Escape and back close without keeping anything
    await click('.et-social [data-social-action="edit"]');
    typeInto('name', 'nope');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await sleep(50);
    res.escape = !modal() && stored().name === 'Mira 的小号' && !!panel.querySelector('.et-social');
    await click('.et-social [data-social-action="edit"]');
    typeInto('name', 'nope');
    await click('[data-social-action="edit-close"]');
    res.backDiscards = !modal() && stored().name === 'Mira 的小号';

    // A failed upload: said so, nothing changed, the dialog stays
    imageRequests.length = 0;
    failUpload = true;
    await click('.et-social [data-social-action="edit"]');
    typeInto('name', 'changed');
    window.__nextFile = await imageFile(300, 300, '#00f');
    await click('[data-social-action="edit-avatar"]', 400);
    await click('[data-social-action="edit-save"]', 200);
    res.failed = !!modal() && /Could not save the image/.test(modal().querySelector('.x-edit-error')?.textContent || '') && stored().name === 'Mira 的小号' && !stored().avatar
        && field('name').value === 'changed' && !modal().querySelector('.x-save-btn').disabled;
    failUpload = false;
    await click('[data-social-action="edit-close"]');

    // Saved unchanged, a blank account keeps following the character
    delete env.settings.socialAccounts['mira.png'];
    r.closeSocial();
    r.openSocial();
    await sleep(100);
    await click('.et-social [data-social-action="edit"]');
    res.blankValues = field('name').value === 'Mira' && field('handle').value === 'mira' && field('followers').value === '';
    await click('[data-social-action="edit-save"]', 100);
    res.defaultsUnset = JSON.stringify(stored()) === '{}';
    r.closeSocial();
    res.closesWithPage = !modal();

    res.allPass = Object.values(res).every(v => v === true);
    return res;
};

/**
 * The panel around the page (2026-11-08): dragged by the X page's top bar and resized
 * by its corners as by the chat's; Echogram's send button centred on a one-line field
 * whatever its height, at the bottom once it grows; on a computer above SillyTavern's top bar, with the settings and archives above it; the ⋯ menu closed by opening the page.
 */
window.runFrameTest = async function () {
    const res = {};
    const panel = document.getElementById('et-panel');
    env.settings.defaultPlatform = 'echotext';
    await sleep(0);
    r.renderMessages(history);
    r.syncPlatformChrome();
    r.makePanelDraggable();
    r.makePanelResizable();
    r.openSocial();
    await sleep(200);
    const center = el => { const b = el.getBoundingClientRect(); return b.top + b.height / 2; };
    const mouse = (el, type, x, y) => el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, button: 0, clientX: x, clientY: y }));

    // Dragged by the top bar, not by its back button
    const bar = panel.querySelector('.et-social .x-topbar');
    const b = bar.getBoundingClientRect();
    panel.style.left = '16px';
    mouse(bar, 'mousedown', b.right - 20, b.top + 20);
    mouse(document, 'mousemove', b.right + 20, b.top + 50);
    mouse(document, 'mouseup', b.right + 20, b.top + 50);
    res.dragsByBar = panel.style.left === '56px' && env.settings.panelLeft === 56;
    panel.style.left = '16px';
    const back = bar.querySelector('[data-social-action="back"]');
    mouse(back, 'mousedown', 30, 30);
    mouse(document, 'mousemove', 90, 90);
    mouse(document, 'mouseup', 90, 90);
    res.backDoesntDrag = panel.style.left === '16px';
    res.grabCursor = getComputedStyle(bar).cursor === 'grab';

    // The corners are on top of the page (inside the rounded edge, which clips them as on the chat)
    await sleep(50);
    const p = panel.getBoundingClientRect();
    const corners = [[p.left + 10, p.top + 10], [p.right - 10, p.top + 10], [p.left + 10, p.bottom - 10], [p.right - 10, p.bottom - 10]];
    res.cornersOnTop = corners.every(([x, y]) => document.elementFromPoint(x, y)?.classList.contains('et-resize-handle'));
    r.closeSocial();

    // The send button: centred on a one-line field, at its usual height and a taller one
    const wrap = panel.querySelector('.et-input-wrap');
    const input = document.getElementById('et-input');
    const send = document.getElementById('et-send-btn');
    res.centred48 = Math.abs(center(wrap) - center(send)) < 0.6;
    wrap.style.setProperty('min-height', '56px');
    res.centred56 = Math.abs(center(wrap) - center(send)) < 0.6;
    wrap.style.removeProperty('min-height');
    input.value = '一行';
    r.fitInputHeight(input);
    res.oneLineNotTall = !panel.querySelector('.et-input-bar').classList.contains('et-input-bar-tall') && Math.abs(center(wrap) - center(send)) < 0.6;
    input.value = '第一行\n第二行\n第三行';
    r.fitInputHeight(input);
    const sendBox = send.getBoundingClientRect(), wrapBox = wrap.getBoundingClientRect();
    res.grownAtBottom = panel.querySelector('.et-input-bar').classList.contains('et-input-bar-tall') && Math.abs(wrapBox.bottom - sendBox.bottom - 3) < 0.6 && wrapBox.height > 70;
    input.value = '';
    r.fitInputHeight(input);
    res.clearedBack = !panel.querySelector('.et-input-bar').classList.contains('et-input-bar-tall') && input.style.height === 'auto' && Math.abs(center(wrap) - center(send)) < 0.6;

    // Echogram's layer, on a computer, above SillyTavern's top bar (3005; 4005 with a drawer open)
    document.getElementById(r.ET_PORTAL_ID)?.remove();
    const portal = r.ensurePortal();
    res.portalAboveTopBar = Number(portal.style.zIndex) > 4005;
    // Settings and archives, on <body> on a computer, above the panel's layer
    const layer = cls => { const el = document.createElement('div'); el.className = cls; document.body.appendChild(el); const z = Number(getComputedStyle(el).zIndex); el.remove(); return z; };
    res.settingsAbovePanel = layer('et-settings-modal') > Number(portal.style.zIndex) && layer('et-sl-overlay') > Number(portal.style.zIndex);
    portal.remove();

    // Opening the page closes the chat's ⋯ menu
    const overflow = document.getElementById('et-overflow-menu');
    overflow.classList.add('et-overflow-menu-open');
    r.openSocial();
    await sleep(50);
    res.overflowCloses = !overflow.classList.contains('et-overflow-menu-open');
    r.closeSocial();

    res.allPass = Object.values(res).every(v => v === true);
    return res;
};

/**
 * New posts, freestyle (17c), through index.js's real generateSocialPosts with the model
 * stubbed: the compose button, the dialog, what the model is sent, what's kept from its
 * answer, a failure, closing while it writes.
 */
window.runComposeTest = async function () {
    const res = {};
    const panel = document.getElementById('et-panel');
    const page = () => panel.querySelector('.et-social');
    const modal = () => panel.querySelector('.et-social-modal');
    const click = async (sel, wait = 60) => { (modal() || page()).querySelector(sel).click(); await sleep(wait); };
    const realNow = Date.now();
    const H = 3600000;
    env.settings.defaultPlatform = 'echotext';
    env.settings.ctxWorldInfo = true;
    env.settings.socialAccounts = mockSettings().socialAccounts;
    env.settings.socialAccounts['mira.png'].posts[0].at = realNow - 40 * 24 * H;
    env.settings.socialPosts = { 'mira.png': mockSettings().socialPosts['mira.png'].map((p, i) => ({ ...p, at: realNow - [2, 5 * 24, 20 * 24][i] * H })) };
    r.closeSocial();
    r.openSocial();
    await sleep(200);

    // The compose button, at the panel's bottom right; none on a post's page
    const fab = page().querySelector('[data-social-action="compose"]');
    const fb = fab.getBoundingClientRect(), pb = panel.getBoundingClientRect();
    res.fab = Math.abs(pb.right - 1 - fb.right - 16) < 2 && Math.abs(pb.bottom - 1 - fb.bottom - 16) < 2;
    await click('.x-feed .x-post');
    res.noFabOnPost = !page().querySelector('[data-social-action="compose"]');
    await click('[data-social-action="back"]');

    // The dialog: 1 to 3, 1 picked
    await click('[data-social-action="compose"]');
    res.dialog = !!modal()?.querySelector('.x-compose') && [...modal().querySelectorAll('.x-count')].map(b => b.textContent).join() === '1,2,3'
        && modal().querySelector('.x-count-on').textContent === '1';
    await click('[data-social-action="compose-count"][data-count="3"]');
    res.picked = modal().querySelector('.x-count-on').textContent === '3';

    // Generate: what the model is sent, the button while it writes
    let answer;
    window.__answer = new Promise(res => { answer = res; });
    await click('[data-social-action="compose-go"]');
    const req = modelRequests.at(-1);
    const sys = req.systemPrompt;
    res.oneRequest = modelRequests.length === 1 && req.apiMessages.length === 2 && req.apiMessages[0].role === 'system' && req.apiMessages[1].content === req.rawPrompt;
    res.asks = /^Write 3 new posts\. Choose everything yourself/.test(req.rawPrompt);
    res.filled = !/\{\{\w+\}\}/.test(sys) && sys.startsWith("You write the posts on Mira's anonymous X account.") && sys.includes('Nobody in Mira\'s life knows this account is theirs, 我 included');
    res.card = sys.includes("<character_reference>\nMira's description: Mira, 26, works the night desk at a hotel.") && sys.includes('World Information:\nThe night market by the river opens at 10pm.');
    res.account = sys.includes('Name: m.\nHandle: @mira_after_dark\nBio: 晚上才上线 / 不认识的别加 / no DMs\nFollowers: 23,800\nFollowing: 312') && sys.includes('an account with 23,800 followers');
    const lines = sys.split('Its latest posts, oldest first:\n')[1].split('\n\n')[0].split('\n');
    res.latestPosts = lines.length === 4 && lines[0].startsWith('[Sep') && lines[2] === '[5d ago, with a photo] 周末的展。' && lines[3].startsWith('[2h ago] 今天又在他面前装了一整天没事人。 回家路上');
    res.generating = !modal().querySelector('.x-compose-go') && modal().querySelector('.x-compose-cancel')?.textContent === 'Cancel'
        && modal().querySelector('.x-compose-what').textContent === 'Generating...' && modal().querySelector('.x-count').disabled;

    // The answer: thinking dropped, three of four kept, times between the latest post and now, oldest first
    const replies = Array.from({ length: 12 }, (_, i) => `<reply name="路人${i}" handle="lurker_${i}" likes="${20 - i}">回复${i}</reply>`).join('\n');
    answer(`<think>plan</think>
<post ago="3小时" likes="1.2K" reposts="30" views="4万" replies="210">
<text>凌晨三点前台又只剩我一个</text>
${replies}
</post>
<post ago="40m" likes="88">
<text>他今天问我是不是没睡好。是。因为你。</text>
<image>酒店前台的台灯，旁边一杯冷掉的咖啡</image>
<reply name="Kai" likes="2">who's "you" 👀</reply>
<post likes="5">no closing tag and no time
<post ago="1m">a fourth one, past the three asked for</post>`);
    await sleep(150);
    const kept = env.settings.socialPosts['mira.png'];
    const added = kept.slice(3);
    // "3小时" is before the latest post (2h ago): put just after it. The one with no time is spread to about 30m ago
    res.keptThree = kept.length === 6 && added.map(p => p.text).join('|') === '凌晨三点前台又只剩我一个|他今天问我是不是没睡好。是。因为你。|no closing tag and no time';
    const after = realNow - 2 * H;
    res.times = added.every(p => p.at > after && p.at <= Date.now()) && added.every((p, i) => !i || p.at >= added[i - 1].at)
        && Math.abs(added.find(p => p.text.startsWith('他今天')).at - (realNow - 40 * 60000)) < 5000;
    const big = added.find(p => p.text.startsWith('凌晨'));
    res.numbers = big.likes === 1200 && big.views === 40000 && big.replyCount === 210 && big.replies.length === 5 && big.replies[0].handle === 'lurker_0';
    const photo = added.find(p => p.text.startsWith('他今天'));
    res.photoAndReply = photo.image === '酒店前台的台灯，旁边一杯冷掉的咖啡' && photo.replies[0].name === 'Kai' && photo.replies[0].handle === 'Kai' && photo.replies[0].at > photo.at;
    res.ids = new Set(kept.map(p => p.id)).size === 6 && saves > 0;
    res.closedAndShown = !modal() && page().querySelector('.x-topbar-sub').textContent === '7 posts' && page().scrollTop === 0
        && page().querySelector('.x-feed .x-post:nth-child(2) .x-post-text').textContent === 'no closing tag and no time';
    res.clampedAfterLatest = Math.abs(added[0].at - (realNow - 2 * H + 60000)) < 5000;

    // No posts in the answer: said so, nothing kept, try again
    await click('[data-social-action="compose"]');
    window.__answer = Promise.resolve('Sorry, I can\'t help with that.');
    await click('[data-social-action="compose-go"]', 150);
    res.failed = !!modal() && /Could not write the posts: the model sent back no posts/.test(modal().querySelector('.x-edit-error')?.textContent || '')
        && env.settings.socialPosts['mira.png'].length === 6 && !modal().querySelector('.x-compose-go').disabled;

    // A request that throws (the connection failing): said so, nothing kept, try again
    window.__answer = Promise.reject(new Error('HTTP 502'));
    await click('[data-social-action="compose-go"]', 150);
    res.throws = !!modal() && modal().querySelector('.x-edit-error')?.textContent === 'Could not write the posts: HTTP 502'
        && env.settings.socialPosts['mira.png'].length === 6 && !!modal().querySelector('.x-compose-go');

    // Cancel while it writes: the request stopped, the dialog stays to try again, what comes back not kept
    let cancelled;
    window.__answer = new Promise(res => { cancelled = res; });
    await click('[data-social-action="compose-go"]');
    const cancelSignal = modelRequests.at(-1).signal;
    await click('[data-social-action="compose-cancel"]');
    res.cancel = !!modal() && cancelSignal.aborted && !!modal().querySelector('.x-compose-go') && !modal().querySelector('.x-edit-error')
        && modal().querySelector('.x-mode-on').textContent === 'Freestyle' && !modal().querySelector('.x-count').disabled;
    cancelled('<post ago="1m"><text>cancelled one</text></post>');
    await sleep(100);
    res.cancelledNotKept = env.settings.socialPosts['mira.png'].length === 6 && !!modal() && !modal().querySelector('.x-edit-error');

    // Closed while it writes: the request stopped, what comes back not kept
    let late;
    window.__answer = new Promise(res => { late = res; });
    await click('[data-social-action="compose-go"]');
    const signal = modelRequests.at(-1).signal;
    await click('[data-social-action="compose-close"]');
    res.closeStops = !modal() && signal.aborted;
    late('<post ago="1m"><text>too late</text></post>');
    await sleep(100);
    res.lateNotKept = env.settings.socialPosts['mira.png'].length === 6;

    // Escape closes it too
    await click('[data-social-action="compose"]');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await sleep(50);
    res.escape = !modal();
    r.closeSocial();

    res.allPass = Object.values(res).every(v => v === true);
    return res;
};

/**
 * New posts, scripted (17d): the outlines in the dialog, what the model is sent, and that
 * only its words and repliers are kept from the answer.
 */
window.runScriptedTest = async function () {
    const res = {};
    const panel = document.getElementById('et-panel');
    const page = () => panel.querySelector('.et-social');
    const modal = () => panel.querySelector('.et-social-modal');
    const click = async (sel, wait = 60) => { (modal() || page()).querySelector(sel).click(); await sleep(wait); };
    const field = (i, key) => modal().querySelector(`[data-social-field="outline-${i}-${key}"]`);
    const type = (i, key, value) => { field(i, key).value = value; };
    const realNow = Date.now();
    const H = 3600000;
    const local = at => new Date(at - new Date(at).getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    env.settings.defaultPlatform = 'echotext';
    env.settings.ctxWorldInfo = true;
    env.settings.socialAccounts = mockSettings().socialAccounts;
    env.settings.socialPosts = { 'mira.png': [] };
    r.closeSocial();
    r.openSocial();
    await sleep(200);

    // Freestyle first, no fields; Scripted shows one outline per post asked for
    await click('[data-social-action="compose"]');
    res.freestyleFirst = modal().querySelector('.x-mode-on').textContent === 'Freestyle' && !modal().querySelector('.x-outline');
    await click('[data-social-action="compose-mode"][data-mode="scripted"]');
    res.oneOutline = modal().querySelectorAll('.x-outline').length === 1 && !modal().querySelector('.x-outline-title');
    type(0, 'topic', '他今天又问我累不累');
    await click('[data-social-action="compose-count"][data-count="2"]');
    res.typedKept = modal().querySelectorAll('.x-outline').length === 2 && field(0, 'topic').value === '他今天又问我累不累';
    await click('[data-social-action="compose-mode"][data-mode="freestyle"]');
    await click('[data-social-action="compose-mode"][data-mode="scripted"]');
    res.keptThroughModes = field(0, 'topic').value === '他今天又问我累不累';

    // Inside the dialog, however tall: it ends within the panel and its fields scroll
    const box = modal().querySelector('.x-compose').getBoundingClientRect();
    res.fitsPanel = box.bottom <= panel.getBoundingClientRect().bottom;

    // The outlines: the first posted later than the second, a photo on one, a capped reply count
    type(0, 'time', local(realNow - 2 * H));
    type(0, 'likes', '1.2K');
    type(0, 'reposts', '30');
    type(0, 'views', '40,000');
    type(0, 'replies', '210');
    type(0, 'replyStyle', '都在嘲讽他');
    type(1, 'time', local(realNow - 26 * H));
    field(1, 'photo').checked = true;
    type(1, 'likes', '7');
    type(1, 'replies', '1');
    let answer;
    window.__answer = new Promise(ok => { answer = ok; });
    await click('[data-social-action="compose-go"]');
    const req = modelRequests.at(-1);
    const sys = req.systemPrompt;
    res.disabled = field(0, 'topic').disabled && modal().querySelector('.x-compose-what').textContent === 'Generating...';
    res.rules = sys.includes('Write each post to its outline') && sys.includes('Make up a display name and handle for each replier') && !/\{\{\w+\}\}/.test(sys);
    res.notFreestyle = !sys.includes('fit an account with') && !sys.includes('ago="5h"') && sys.includes('<post n="1">');
    const prompt = req.rawPrompt;
    res.outlinesOldestFirst = /^Write 2 new posts to these outlines\./.test(prompt) && prompt.indexOf('Posted: 1d ago') < prompt.indexOf('Posted: 2h ago');
    res.first = prompt.includes('<outline n="2">\nPosted: 2h ago\nTopic: 他今天又问我累不累\nPhoto: no\nNumbers: 1,200 likes, 30 reposts, 40,000 views\nReplies: write 5 (of 210 in all)\nReply style: 都在嘲讽他\n</outline>');
    res.second = prompt.includes('<outline n="1">\nPosted: 1d ago\nTopic: whatever Mira would post\nPhoto: yes\nNumbers: 7 likes, 0 reposts, 0 views\nReplies: write 1\n</outline>');

    // The answer: numbers and times the model wrote are ignored, its words and repliers kept
    const many = Array.from({ length: 7 }, (_, i) => `<reply name="路人${i}" handle="lurker_${i}" likes="${9 - i}">嘲讽${i}</reply>`).join('\n');
    answer(`<think>plan</think>
<post n="2" ago="1m" likes="999999" views="1">
<text>累。但你问了我就不累了。</text>
<image>should not be kept</image>
${many}
</post>
<post n="1" likes="5">
<text>昨晚的月亮</text>
<reply name="阿凯" handle="@kai_00" likes="1">好看</reply>
<reply name="多余的" handle="extra">past the one asked for</reply>
</post>`);
    await sleep(150);
    const kept = env.settings.socialPosts['mira.png'];
    const oldest = kept[0], newest = kept[1];
    res.kept = kept.length === 2 && oldest.text === '昨晚的月亮' && newest.text === '累。但你问了我就不累了。';
    res.times = Math.abs(oldest.at - (realNow - 26 * H)) < 60000 && Math.abs(newest.at - (realNow - 2 * H)) < 60000;
    res.numbers = newest.likes === 1200 && newest.reposts === 30 && newest.views === 40000 && newest.replyCount === 210 && oldest.likes === 7 && oldest.views === 0 && oldest.replyCount === 1;
    res.image = newest.image === '' && oldest.image === 'Photo';
    res.replies = newest.replies.length === 5 && newest.replies[0].name === '路人0' && newest.replies[0].handle === 'lurker_0' && newest.replies[0].likes === 9
        && oldest.replies.length === 1 && oldest.replies[0].name === '阿凯' && oldest.replies[0].handle === 'kai_00' && oldest.replies[0].at > oldest.at;
    res.closed = !modal();

    // No <post n>: in order. A time ahead of now is now. No replies asked for: none kept
    await click('[data-social-action="compose"]');
    await click('[data-social-action="compose-mode"][data-mode="scripted"]');
    type(0, 'time', local(realNow + 48 * H));
    window.__answer = Promise.resolve('<post><text>no number</text><reply name="x">not asked for</reply></post>');
    await click('[data-social-action="compose-go"]', 150);
    const late = env.settings.socialPosts['mira.png'][2];
    res.noNumberNoReplies = late?.text === 'no number' && late.replies.length === 0 && late.replyCount === 0 && late.at <= Date.now();

    // A failed one: said so, what's typed still there
    await click('[data-social-action="compose"]');
    await click('[data-social-action="compose-mode"][data-mode="scripted"]');
    type(0, 'topic', 'kept after a failure');
    window.__answer = Promise.reject(new Error('HTTP 502'));
    await click('[data-social-action="compose-go"]', 150);
    res.failureKeepsTyping = modal().querySelector('.x-edit-error')?.textContent === 'Could not write the posts: HTTP 502' && field(0, 'topic').value === 'kept after a failure' && !field(0, 'topic').disabled;
    await click('[data-social-action="compose-close"]');
    r.closeSocial();

    res.allPass = Object.values(res).every(v => v === true);
    return res;
};

/** A post's photo: hidden words, shown and hidden by a tap, a real image added, changed and removed. */
window.runPhotoTest = async function () {
    const res = {};
    const panel = document.getElementById('et-panel');
    const page = () => panel.querySelector('.et-social');
    const media = () => page().querySelector('.x-media');
    const words = () => media().querySelector('.x-media-text');
    const tools = () => media().querySelector('.x-media-tools');
    const shown = el => getComputedStyle(el).display !== 'none';
    const pixel = c => `data:image/png;base64,${c}`;
    const A = pixel('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==');
    const B = pixel('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==');
    env.settings.defaultPlatform = 'echotext';
    env.settings.socialAccounts = mockSettings().socialAccounts;
    env.settings.socialPosts = mockSettings().socialPosts;
    const stored = () => [...env.settings.socialAccounts['mira.png'].posts, ...env.settings.socialPosts['mira.png']].find(p => p.image);
    r.closeSocial();
    r.openSocial();
    await sleep(200);

    // Closed by default: the frame and its icon, no words, no buttons; 4:3
    const box = media().getBoundingClientRect();
    res.closed = !shown(words()) && !shown(tools()) && shown(media().querySelector('.x-media-icon')) && Math.abs(box.width / box.height - 4 / 3) < 0.03;

    // A wider panel doesn't make it bigger; a narrower one shrinks it
    const sizeAt = async (width) => {
        panel.style.setProperty('width', `${width}px`, 'important');
        await sleep(40);
        return media().getBoundingClientRect().width;
    };
    const atDefault = media().getBoundingClientRect().width;
    const wide = await sizeAt(760), narrow = await sizeAt(320);
    panel.style.removeProperty('width');
    await sleep(40);
    res.capped = Math.abs(atDefault - 296) < 1 && Math.abs(wide - 296) < 1 && narrow < 250;

    // A tap: the words and the button, still on the list. Another: gone
    media().click();
    await sleep(30);
    res.tapShows = shown(words()) && shown(tools()) && !shown(media().querySelector('.x-media-icon')) && !page().querySelector('.x-status') && !tools().querySelector('.x-media-drop');
    media().click();
    await sleep(30);
    res.tapHides = !shown(words()) && !shown(tools());

    // Cancelled: nothing changes
    media().click();
    imageRequests.length = 0;
    window.__nextFile = null;
    tools().querySelector('[data-social-action="photo-add"]').click();
    await sleep(100);
    res.cancelled = !stored().photo && imageRequests.length === 0 && shown(words());

    // An image: uploaded, kept on the post, in its own shape, closed again
    window.__uploadPath = A;
    window.__nextFile = await imageFile(800, 400, '#c33');
    tools().querySelector('[data-social-action="photo-add"]').click();
    await sleep(400);
    res.uploaded = imageRequests.length === 1 && imageRequests[0].join() === '/api/images/upload,echogram-social-photo-N';
    res.kept = stored().photo?.path === A && stored().photo.width === 800 && stored().photo.height === 400 && saves > 0;
    const img = () => media().querySelector('.x-media-img');
    const shape = ratio => { const b = media().getBoundingClientRect(); return Math.abs(b.width / b.height - ratio) < 0.03; };
    res.image = img()?.getAttribute('src') === A && shape(2) && !shown(media().querySelector('.x-media-icon')) && !shown(words());
    media().click();

    await tap(card('a'), 'post-menu');
    await tap(card('a'), 'post-retry', 150);
    res.failure = told === 1 && s.socialPosts['mira.png'][0].text.startsWith('今天又在他面前') && !card('a').hasAttribute('data-retrying');

    // Ending while the new-posts dialog is open: what's typed in it stays
    window.__answer = new Promise(res => { answer = res; });
    await tap(card('a'), 'post-menu');
    await tap(card('a'), 'post-retry');
    await tap(page(), 'compose');
    await tap(modal(), 'compose-mode');
    modal().querySelectorAll('.x-compose-mode button, [data-social-action="compose-mode"]').forEach(b => b.getAttribute('data-mode') === 'scripted' && b.click());
    await sleep(60);
    const topic = modal().querySelector('[data-social-field="outline-0-topic"]');
    topic.value = '打字中';
    answer('<post ago="1m"><text>新的 a</text></post>');
    await sleep(150);
    res.dialogKept = modal().querySelector('[data-social-field="outline-0-topic"]')?.value === '打字中' && s.socialPosts['mira.png'][0].text === '新的 a';
    await tap(modal(), 'compose-close');

    // The post's page
    page().querySelector('.x-feed .x-post[data-post-id="b"]').click();
    await sleep(60);
    window.__answer = new Promise(res => { answer = res; });
    await tap(page().querySelector('.x-status'), 'post-menu');
    await tap(page().querySelector('.x-status'), 'post-retry');
    res.pageFaded = page().querySelector('.x-status').hasAttribute('data-retrying') && getComputedStyle(page().querySelector('.x-replies')).animationName === 'x-retrying';
    answer('<post ago="1m"><text>页面上的新版</text></post>');
    await sleep(150);
    res.pageShown = page().querySelector('.x-status-text').textContent === '页面上的新版' && !page().querySelector('.x-status').hasAttribute('data-retrying');

    window.toastr = realToastr;
    modelRequests.length = 0;
    r.closeSocial();
    res.allPass = Object.values(res).every(v => v === true);
    return res;
};

// A page to look at
(async () => {
    const which = params.get('view');
    if (!which) return;
    await sleep(100);
    const v = view(which === 'empty' ? {} : mockSettings());
    v.open();
    if (which === 'compose') {
        await sleep(200);
        document.querySelector('#et-panel [data-social-action="compose"]').click();
    }
    if (which === 'scripted') {
        await sleep(200);
        document.querySelector('#et-panel [data-social-action="compose"]').click();
        await sleep(50);
        document.querySelector('#et-panel [data-social-action="compose-count"][data-count="2"]').click();
        await sleep(50);
        document.querySelector('#et-panel [data-social-action="compose-mode"][data-mode="scripted"]').click();
    }
    if (which === 'edit') {
        await sleep(200);
        document.querySelector('#et-panel [data-social-action="edit"]').click();
    }
    if (which === 'detail') {
        await sleep(200);
        document.querySelector('#et-panel .x-post[data-post-id="a"]').click();
    }
})();
</script>
