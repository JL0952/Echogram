<!doctype html>
<html><head><meta charset="utf-8">
<title>Attach panel test</title>
<link rel="stylesheet" href="build/vendor/css/fontawesome.min.css">
<link rel="stylesheet" href="build/vendor/css/solid.min.css">
<link rel="stylesheet" href="../../style.css">
<style>
    body { background: #1b1d2b; margin: 0; }
    #et-panel { position: fixed !important; left: 16px !important; top: 10px !important; width: 380px !important; height: 600px !important;
        opacity: 1 !important; transform: none !important; display: flex !important; flex-direction: column; }
    #et-panel .et-panel-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
</style>
</head><body>
<div id="host"></div>
<script src="build/vendor/jquery-3.5.1.min.js"></script>
<script src="build/vendor/purify.min.js"></script>
<script>window.SillyTavern = { libs: { DOMPurify: window.DOMPurify } };</script>
<script src="../../lib/rich-messages.js"></script>
<script src="../../lib/features.js"></script>
<script src="../../lib/chat-view-model.js"></script>
<script src="../../platforms/echotext/platform.js"></script>
<script src="../../platforms/wechat/platform.js"></script>
<script src="scenarios.js"></script>
<script src="build/bundle-chrome.js"></script>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
const scheme = new URLSearchParams(location.search).get('scheme') || 'dark';
const sc = window.EchoTextScenarios[0];
const history = JSON.parse(JSON.stringify(sc.history));
const calls = [];
const env = { settings: { ...sc.settings, autoScroll: true, defaultPlatform: 'wechat' }, groupManager: null, FA_REACTIONS: window.EchoTextScenarioReactions,
    showTypingIndicator: false, BASE_URL: '', VERSION_QUERY: '',
    getCurrentCharacter: () => ({ name: 'Mira', avatar: 'mira.png' }), getCharacterName: () => 'Mira', isTetheredMode: () => true,
    getUserName: () => '我', getCharacterKey: () => 'mira.png', getCharAvatarUrl: () => null, _pickerAvatarBg: () => '#7c6f9c',
    isMobileDevice: () => false, getChatHistory: () => history, getUserAvatarUrl: () => null, isCombinedGroupMode: () => false,
    closeAllDotMenus: () => jQuery('.et-dots-menu').remove(),
    panelOpen: true, saveSettings: () => calls.push(['saveSettings']),
    pickImageFile: () => Promise.resolve(window.__nextFile || null) };
const r = window.EchoTextHarness.chrome(env);
document.getElementById('host').innerHTML = r.buildPanelHtml();
r.bindAttachPanel();
r.renderMessages(history);

window.runPanelTest = async function () {
    const el = document.getElementById('et-messages');
    const panelEl = () => document.getElementById('et-attach-panel');
    const plus = () => r.toggleAttachMenu(jQuery('#et-attach-btn'));   // what the "+" click handler calls
    const res = {};
    jQuery('#et-panel').attr('data-et-scheme', scheme);
    el.scrollTop = el.scrollHeight;
    await sleep(300);
    const bottomGap = () => Math.round(el.scrollHeight - el.scrollTop - el.clientHeight);

    // 1. "+" opens the panel under the input bar, the list keeps its last lines
    const gapBefore = bottomGap();
    plus();
    await sleep(250);
    const p = panelEl();
    res.opens = !!p && p.previousElementSibling?.matches('[data-et-role~="input-bar"]');
    res.tiles = p ? [...p.querySelectorAll('.et-attach-panel-item')].map(t => `${t.dataset.mode}:${t.textContent.trim()}`) : [];
    res.panelHeight = p ? Math.round(p.getBoundingClientRect().height) : 0;
    res.stillAtBottom = bottomGap() <= gapBefore + 1;
    res.insidePanel = p ? p.getBoundingClientRect().right <= document.getElementById('et-panel').getBoundingClientRect().right + 0.5 : false;
    window.__shot = true;
    await sleep(window.__hold || 0);

    // 2. "+" again closes it
    plus();
    res.plusCloses = !panelEl();

    // 3. a tile picks its mode and closes the panel; a panel still shrinking away ignores taps
    plus(); await sleep(50);
    res.closingPanels = document.querySelectorAll('.et-attach-panel:not(#et-attach-panel)').length;
    jQuery('.et-attach-panel-item[data-mode="transfer"]').trigger('click');
    res.tile = { mode: jQuery('.et-input-wrap').attr('data-et-compose'), closed: !panelEl(), inputFocused: document.activeElement?.id === 'et-input' };
    r.setComposeMode(null);

    // 4. tapping the message list closes it
    document.getElementById('et-input').blur();
    plus(); await sleep(50);
    jQuery('#et-messages-inner').trigger('click');
    res.messagesClose = !panelEl();

    // 5. focusing the input closes it
    plus(); await sleep(50);
    document.getElementById('et-input').focus();
    res.inputCloses = !panelEl();
    document.getElementById('et-input').blur();

    // 5b. "+" and 发送 share a slot: one at a time, even after a render while typing
    //     (jQuery's show() there once pinned "+" visible with an inline style)
    const input = document.getElementById('et-input');
    const shown = id => getComputedStyle(document.getElementById(id)).display !== 'none';
    input.value = '你好';
    r.renderMessages(history);
    const typing = { plus: shown('et-attach-btn'), send: shown('et-send-btn') };
    input.value = '';
    r.renderMessages(history);
    const empty = { plus: shown('et-attach-btn'), send: shown('et-send-btn') };
    res.plusOrSend = !typing.plus && typing.send && empty.plus && !empty.send;

    // 6. switching to a platform without a panel closes it; its "+" opens the popup menu
    plus(); await sleep(50);
    env.settings.defaultPlatform = 'echotext';
    await sleep(0);
    r.renderMessages(history);
    res.switchCloses = !panelEl();
    await sleep(0);
    plus(); await sleep(50);
    res.echotextUsesMenu = !panelEl() && !!document.querySelector('.et-attach-menu');
    jQuery('.et-attach-menu').remove();
    env.settings.defaultPlatform = 'wechat';
    await sleep(0);
    r.renderMessages(history);
    return res;
};

// The character's avatar: tapping it (WeChat: beside its messages) opens the avatar
// menu; "Change Avatar" picks a file, crops it in SillyTavern's crop dialog (stubbed:
// returns the image), shrinks it, uploads it to the user's images (stubbed fetch) and
// shows it everywhere; "Use Card Avatar" goes back and deletes the uploaded file.
window.runAvatarTest = async function () {
    const requests = [];
    const realFetch = window.fetch;
    let uploads = 0, lastImage = '';
    // Real (tiny) images, so they load and stay; labels keep the checks readable
    const tiny = color => { const c = document.createElement('canvas'); c.width = c.height = 4; const x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, 4, 4); return c.toDataURL(); };
    const labels = new Map();
    const CARD = tiny('#00f');
    labels.set(CARD, 'card');
    const label = url => labels.get(url) || url;
    window.fetch = async (url, init) => {
        const body = JSON.parse(init.body);
        if (url.endsWith('upload')) lastImage = body.image;
        requests.push([url, url.endsWith('upload') ? { format: body.format, ch_name: body.ch_name, filename: body.filename.replace(/\d+$/, 'N'), image: body.image.slice(0, 4) } : body]);
        if (url === '/api/images/upload') {
            const path = tiny(['#f00', '#0f0', '#ff0'][uploads]);
            labels.set(path, `upload${++uploads}`);
            return { ok: true, json: async () => ({ path }) };
        }
        return { ok: true, json: async () => ({}) };
    };
    let cropAspect = null;
    window.SillyTavern.getContext = () => ({
        POPUP_TYPE: { CROP: 5 }, getRequestHeaders: () => ({ 'Content-Type': 'application/json' }),
        getThumbnailUrl: () => CARD,
        callGenericPopup: async (content, type, input, opts) => { cropAspect = opts.cropAspect; return type === 5 ? opts.cropImage : null; },
    });
    const canvas = document.createElement('canvas');
    canvas.width = 900; canvas.height = 900;
    canvas.getContext('2d').fillStyle = '#c33'; canvas.getContext('2d').fillRect(0, 0, 900, 900);
    window.__nextFile = new File([await new Promise(res => canvas.toBlob(res, 'image/png'))], 'photo.png', { type: 'image/png' });

    r.bindMessageActions();
    r.renderMessages(history);
    const inner = document.getElementById('et-messages-inner');
    const charAvatarSrcs = () => [...new Set([...inner.querySelectorAll('.wx-row-left .wx-avatar img')].map(i => label(i.getAttribute('src'))))].join(' ');
    const menuItems = () => [...document.querySelectorAll('.et-avatar-menu .et-dots-item')].map(b => b.dataset.avatar).join(',');
    const pick = async (choice) => { document.querySelector(`.et-avatar-menu [data-avatar="${choice}"]`).click(); await sleep(400); };
    const res = { card: charAvatarSrcs(), userAvatarClickable: !!inner.querySelector('.wx-row-right .wx-avatar[data-et-action]') };

    inner.querySelector('.wx-row-left .wx-avatar').click(); await sleep(50);
    res.menuBefore = menuItems();
    await pick('change');
    res.afterChange = charAvatarSrcs();
    res.stored = JSON.stringify(Object.fromEntries(Object.entries(env.settings.avatarByCharacter).map(([k, v]) => [k, label(v)])));
    res.cropAspect = cropAspect;
    const uploaded = requests.find(q => q[0] === '/api/images/upload');
    res.upload = uploaded && JSON.stringify(uploaded[1]);

    inner.querySelector('.wx-row-left .wx-avatar').click(); await sleep(50);
    res.menuAfter = menuItems();
    await pick('change');
    res.secondChangeDeletesFirst = JSON.stringify(requests.filter(q => q[0] === '/api/images/delete').map(q => label(q[1].path)));

    inner.querySelector('.wx-row-left .wx-avatar').click(); await sleep(50);
    await pick('reset');
    res.afterReset = charAvatarSrcs();
    res.deletes = JSON.stringify(requests.filter(q => q[0] === '/api/images/delete').map(q => label(q[1].path)));
    res.storedAfterReset = JSON.stringify(env.settings.avatarByCharacter);

    // The uploaded image is shrunk to 512 px (the stubbed crop returns the 900 px original)
    const img = new Image();
    await new Promise(done => { img.onload = done; img.onerror = done; img.src = 'data:image/jpeg;base64,' + lastImage; });
    res.uploadedSize = `${img.naturalWidth}x${img.naturalHeight}`;
    window.fetch = realFetch;
    res.ok = res.card === 'card' && !res.userAvatarClickable && res.menuBefore === 'view,change'
        && res.afterChange === 'upload1' && res.stored === '{"mira.png":"upload1"}'
        && res.cropAspect === 1 && res.uploadedSize === '512x512' && res.upload === '{"format":"jpeg","ch_name":"Mira","filename":"echotext-avatar-N","image":"/9j/"}'
        && res.menuAfter === 'view,change,reset' && res.secondChangeDeletesFirst === '["upload1"]'
        && res.afterReset === 'card' && res.storedAfterReset === '{}'
        && res.deletes === '["upload1","upload2"]';
    return res;
};

// Touch screens: a bubble's "⋯" stays hidden until the bubble is tapped (text or
// photo); a second tap or a tap elsewhere hides it, tapping "⋯" keeps it. Run with
// the Browser pane on its mobile preset, so (hover: none) matches.
window.runRevealTest = async function () {
    if (!matchMedia('(hover: none)').matches) return { skipped: 'needs a touch screen (hover: none)' };
    r.bindMessageActions();
    const inner = document.getElementById('et-messages-inner');
    const rows = [...inner.querySelectorAll('.wx-row')];
    const shown = () => rows.filter(row => getComputedStyle(row.querySelector('.wx-more')).pointerEvents !== 'none').map(row => rows.indexOf(row)).join(',');
    const textRow = rows.find(row => row.querySelector('.wx-text p:not(:empty)'));
    const photoRow = rows.find(row => row.querySelector('.wx-photo'));
    const res = { initial: shown() };
    textRow.querySelector('.wx-text p').click();
    res.textTap = shown();
    textRow.querySelector('.wx-text p').click();
    res.secondTap = shown();
    photoRow.querySelector('.wx-photo').click();
    res.photoTap = shown();
    photoRow.querySelector('.wx-more').click();
    res.menuTap = shown();
    inner.click();
    res.elsewhere = shown();
    const t = String(rows.indexOf(textRow)), p = String(rows.indexOf(photoRow));
    res.ok = res.initial === '' && res.textTap === t && res.secondTap === '' && res.photoTap === p && res.menuTap === p && res.elsewhere === '';
    return res;
};

// While the panel rises and falls, the message nearest the input bar keeps its
// distance from it, and the list ends where it started — with the height
// transition and without one (a browser that doesn't run it), at the end of the
// list and scrolled up. Needs the Browser pane visible (animation frames).
window.runAnchorTest = async function () {
    const el = document.getElementById('et-messages');
    const bar = document.querySelector('[data-et-role~="input-bar"]');
    const cycle = async (scrolledUp) => {
        el.style.scrollBehavior = 'auto';
        el.scrollTop = el.scrollHeight - el.clientHeight - scrolledUp;
        el.style.scrollBehavior = '';
        await sleep(300);
        const ref = [...document.querySelectorAll('#et-messages-inner [data-et-role~="message"]')]
            .filter(m => m.getBoundingClientRect().bottom < bar.getBoundingClientRect().top).pop();
        const gap = () => Math.round(bar.getBoundingClientRect().top - ref.getBoundingClientRect().bottom);
        const startTop = el.scrollTop, gaps = [gap()];
        const watch = async () => {
            let on = true;
            const tick = () => { gaps.push(gap()); if (on) requestAnimationFrame(tick); };
            r.toggleAttachMenu(jQuery('#et-attach-btn'));
            requestAnimationFrame(tick);
            await sleep(500);
            on = false;
        };
        await watch();   // open
        await watch();   // close
        const spread = Math.max(...gaps) - Math.min(...gaps);
        return { spread, drift: Math.round(el.scrollTop - startTop), ok: spread <= 2 && Math.abs(el.scrollTop - startTop) <= 1 };
    };
    const res = {};
    const off = document.createElement('style');
    off.textContent = '[data-platform="wechat"] .et-attach-panel { transition: none !important; }';
    for (const transition of [true, false]) {
        if (!transition) document.head.appendChild(off);
        for (const up of [0, 300]) res[`${transition ? 'animated' : 'no transition'}, scrolled up ${up}px`] = await cycle(up);
        off.remove();
    }
    res.ok = Object.values(res).every(v => v.ok);
    return res;
};

// Sharing a file: the "文件" tile shows the kind chip in front of the text; its menu
// picks the kind (WeChat's own wording), and leaving file mode hides it again
window.runShareTypeTest = async function () {
    const chip = () => document.getElementById('et-share-type');
    const res = {};
    env.settings.defaultPlatform = 'wechat';
    r.renderMessages(history);
    res.hiddenAtFirst = chip().hidden;
    r.toggleAttachMenu(jQuery('#et-attach-btn'));
    await sleep(50);
    jQuery('.et-attach-panel-item[data-mode="file"]').trigger('click');
    res.shown = !chip().hidden && chip().textContent.trim() === 'PDF';
    res.placeholder = document.getElementById('et-input').placeholder;
    r.toggleShareTypeMenu(jQuery(chip()));   // what the chip's click handler calls
    await sleep(50);
    res.items = [...document.querySelectorAll('.et-share-type-menu .et-dots-item')].map(b => b.textContent.trim()).join(',');
    jQuery('.et-share-type-menu [data-share-type="link"]').trigger('click');
    await sleep(200);
    res.picked = chip().textContent.trim();
    res.menuClosed = !document.querySelector('.et-share-type-menu.et-dots-menu-open');
    r.setComposeMode(null);
    res.hiddenAfter = chip().hidden;
    res.ok = res.hiddenAtFirst && res.shown && res.placeholder === '标题 | 描述'
        && res.items === 'PDF,Word,Excel,PPT,网页,其他' && res.picked === '网页' && res.menuClosed && res.hiddenAfter;
    return res;
};

// ?report=runPanelTest,runAnchorTest: run those on load and post each result to the
// server (serve.py prints it), for a phone or simulator
const toReport = new URLSearchParams(location.search).get('report');
if (toReport) (async () => {
    await sleep(500);
    for (const name of toReport.split(',')) {
        let result;
        try { result = await window[name](); } catch (e) { result = { error: String(e) }; }
        await fetch('/__log', { method: 'POST', body: JSON.stringify({ [name]: result }) }).catch(() => {});
    }
})();
</script>
</body></html>
