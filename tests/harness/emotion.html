<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion popup test</title>
<link rel="stylesheet" href="build/vendor/css/fontawesome.min.css">
<link rel="stylesheet" href="build/vendor/css/solid.min.css">
<link rel="stylesheet" href="../../style.css">
<style>
    body { background: #1b1d2b; margin: 0; color: #ccd; font: 12px sans-serif; }
    #et-panel { position: fixed !important; left: 16px !important; top: 10px !important; width: var(--w, 380px) !important; height: 640px !important;
        opacity: 1 !important; transform: none !important; display: flex !important; flex-direction: column; }
    #et-panel .et-panel-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
</style>
</head><body>
<div id="host"></div>
<script src="build/vendor/jquery-3.5.1.min.js"></script>
<script src="build/vendor/purify.min.js"></script>
<script>window.SillyTavern = { libs: { DOMPurify: window.DOMPurify } };</script>
<script src="../../lib/rich-messages.js"></script>
<script src="../../lib/features.js"></script>
<script src="../../lib/chat-view-model.js"></script>
<script src="../../platforms/echotext/platform.js"></script>
<script src="../../platforms/wechat/platform.js"></script>
<script src="scenarios.js"></script>
<script src="build/bundle-reply.js"></script>
<script src="../../lib/emotion-model.js"></script>
<script src="../../lib/emotion-icons.js"></script>
<script src="../../lib/texting-behavior.js"></script>
<script src="../../lib/emotion-system.js"></script>
<script src="../../lib/memory-recall.js"></script>
<script src="../../lib/memory-system.js"></script>
<script src="../../lib/chat-summaries.js"></script>
<script src="../../lib/settings-modal.js"></script>
<script>
// The emotion popup and status chip (lib/emotion-system.js) on the real panel, and
// how a reply lands in Auto mode (index.js's generateEchoText / generateEchoTextSwipe,
// with the model stubbed).
//   ?platform=echotext|wechat  ?scheme=dark|light  ?width=320  ?desire  ?scenario=N (tests/harness/scenarios.js; default 0)
//   ?tab=emotions|personality  the popup as a screenshot shows it (filled-in example values; Desire and Morality with ?desire;
//                              &auto: in Auto mode, the last reply's changes beside the values for a few seconds)
//   ?auto                      a reply in Auto mode arriving with the popup closed: the chips under the header
//   ?report                    runs runEmotionTest(), runAutoTest(), runReplyTest(), runTapbackTest(), runMemoryTest() and runSummaryTest() and posts their results
//   ?draft=N                   Reply picked on message N: the quote waiting above the input bar
//   ?memory                    Add Memory open on a bubble, and the settings panel's memory list and summaries beside the panel
(async function () {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const params = new URLSearchParams(location.search);
    const platform = params.get('platform') || 'echotext';
    const scheme = params.get('scheme') || 'dark';
    if (params.get('width')) document.documentElement.style.setProperty('--w', params.get('width') + 'px');
    const sc = window.EchoTextScenarios[Number(params.get('scenario')) || 0];
    const history = JSON.parse(JSON.stringify(sc.history));

    // The extension's settings, as the old emotion system left them
    const settings = {
        emotionMode: 'manual', nsfwEnabled: params.has('desire'), characterProfiles: {},
        emotionState: { 'mira.png': { joy: 40, trust: 20, love: 70, mbtiType: 'ISFP', personalityAnchor: {} } },
    };
    let saves = 0;
    let r;
    const statusRow = () => document.getElementById('et-panel-status-content');
    const emo = window.EchoTextEmotionSystem.createEmotionSystem({
        getSettings: () => settings, saveSettings: () => { saves++; },
        getCharacterKey: () => 'mira.png', getCharacterName: () => 'Mira', isPanelOpen: () => true,
        getChatHistory: key => r.getEmotionHistory(key),
        onEmotionStateUpdated: () => { statusRow().innerHTML = emo.buildStatusHtml(); },
    });
    // What a failed generation reports
    const errors = [];
    window.toastr = { error: m => errors.push(m), warning: m => errors.push(m), success() {}, info() {} };
    const env = { settings: { ...sc.settings, defaultPlatform: platform, chatHistory: { 'mira.png': history } }, groupManager: null, FA_REACTIONS: window.EchoTextScenarioReactions,
        showTypingIndicator: false, BASE_URL: '', VERSION_QUERY: '', panelOpen: true, isGenerating: false,
        emotionSystem: emo, imageGeneration: null, memorySystem: null, gallery: null, abortController: null,
        getCurrentCharacter: () => ({ name: 'Mira', avatar: 'mira.png' }), getCharacterName: () => 'Mira', isTetheredMode: () => true,
        getUserName: () => '我', getCharacterKey: () => 'mira.png', getCharAvatarUrl: () => null, _pickerAvatarBg: () => '#7c6f9c',
        isMobileDevice: () => false, getUserAvatarUrl: () => null, isCombinedGroupMode: () => false,
        // A reply: no delays, the model stubbed (runAutoTest sets what it answers)
        getEmotionReplyTimingModel: () => ({ deliveredDelayMs: 0, readDelayMs: 0, ghostDelayMs: 0, typingLeadMs: 0, replyDelayMs: 0 }),
        sleepWithAbort: async () => {}, error: (...a) => errors.push(a.join(' ')), stripThinkingTags: t => t };
    env.memorySystem = window.EchoTextMemorySystem.createMemorySystem({ getSettings: () => env.settings, saveSettings: () => {}, getCharacterKey: () => 'mira.png' });
    r = window.EchoTextHarness.reply(env);
    document.getElementById('host').innerHTML = r.buildPanelHtml();
    r.renderMessages(history);
    const panel = document.getElementById('et-panel');
    panel.setAttribute('data-et-scheme', scheme);
    statusRow().innerHTML = emo.buildStatusHtml();

    function open() {
        emo.openEmotionPopup();
        return document.getElementById('et-emotion-popup');
    }
    const $p = sel => jQuery('#et-emotion-popup').find(sel);
    const click = sel => $p(sel)[0].click();
    const slide = (id, value) => { const s = $p(`[data-emo-dim="${id}"]`)[0]; s.value = value; s.dispatchEvent(new Event('input', { bubbles: true })); s.dispatchEvent(new Event('change', { bubbles: true })); };
    const rows = () => $p('.et-emo-row').toArray();
    const start = () => settings.emotionState['mira.png'].start;
    const profile = () => settings.characterProfiles['mira.png'];

    window.runEmotionTest = async function () {
        const res = {};
        // The old state is replaced, nothing breaks
        open();
        await sleep(300);
        res.oldStateReplaced = JSON.stringify(start()) === JSON.stringify(window.EchoTextEmotionModel.zeroValues());
        res.statusNeutral = statusRow().textContent === 'Neutral';
        // Neutral is a chip like the feelings', with its own icon
        res.neutralChip = !!statusRow().querySelector('.et-status-chip-emotion .et-status-emotion-icon .et-emo-glyph svg');
        res.rowsNsfwOff = rows().length;                                   // 10: no Desire
        res.groups = $p('.et-emo-group-label').toArray().map(e => e.textContent).join(',');
        res.modeShown = $p('.et-emo-seg-on').text();

        // A slider sets the chat's value and the status chip
        slide('joy', 60);
        res.joySaved = start().joy === 60;
        res.statusJoy = statusRow().textContent === 'Joy';

        // Rapport goes below 0, lit from the middle
        slide('rapport', -80);
        res.rapportSaved = start().rapport === -80;
        res.rapportShown = $p('[data-emo-dim="rapport"]').siblings('.et-emo-val').text() === '−80';
        const rapportStyle = $p('[data-emo-dim="rapport"]')[0].style;
        res.rapportFill = rapportStyle.getPropertyValue('--emo-from') === '10%' && rapportStyle.getPropertyValue('--emo-to') === '50%';
        // The relationship isn't a feeling: Rapport −80 doesn't take the chip from Joy 60
        res.statusSkipsRelation = statusRow().textContent === 'Joy';
        slide('rapport', 0);

        // Buttons redraw the popup without closing it
        click('[data-emo-tab="personality"]');
        click('[data-emo-tab="emotions"]');
        await sleep(300);
        res.staysOpen = !!document.getElementById('et-emotion-popup') && !$p('.et-emo-row').closest('.et-emotion-popup-closing').length;

        // Lock: the value goes to the character, the slider stops moving
        slide('romance', 80);
        click('[data-emo-lock="romance"]');
        res.lockStored = profile().locks.romance === 80;
        res.lockedDisabled = $p('[data-emo-dim="romance"]')[0].disabled;
        slide('romance', 10);
        res.lockedIgnored = emo.getEmotionState().romance === 80;

        // A cleared chat starts at 0; the lock stays
        emo.clearEmotionState();
        const cleared = emo.getEmotionState();
        res.clearKeepsLock = cleared.joy === 0 && cleared.romance === 80;
        // Romance 80 alone is a relationship, not a feeling: the chip says Neutral
        emo.updateEmotionIndicator();
        res.romanceAloneNeutral = statusRow().textContent === 'Neutral';

        // Unlocking hands the value back to the chat
        jQuery('#et-emotion-popup').remove();
        open();
        click('[data-emo-lock="romance"]');
        res.unlockKeepsValue = !('romance' in profile().locks) && start().romance === 80;

        // Reset sets unlocked feelings to 0, locked ones stay
        slide('anger', 45);
        click('[data-emo-lock="anger"]');
        slide('shock', 30);
        click('[data-emo-action="reset"]');
        res.resetKeepsLocks = emo.getEmotionState().shock === 0 && emo.getEmotionState().romance === 0 && emo.getEmotionState().anger === 45;
        click('[data-emo-lock="anger"]');

        // NSFW shows Desire
        settings.nsfwEnabled = true;
        click('[data-emo-tab="emotions"]');
        res.rowsNsfwOn = rows().length;
        res.desireRow = $p('[data-emo-dim="desire"]').length === 1;
        settings.nsfwEnabled = false;

        // Off: only the mode switch, no state, the chip says so
        click('[data-emo-mode="off"]');
        res.offRows = rows().length;
        res.offState = emo.getEmotionState() === null;
        res.statusOff = statusRow().textContent === 'Emotions off';
        click('[data-emo-mode="manual"]');

        // Personality: Big Five levels and the texting style
        click('[data-emo-tab="personality"]');
        res.traits = rows().map(r => r.querySelector('.et-emo-label').textContent).join(',');
        click('[data-emo-trait="E"][data-emo-level="high"]');
        res.traitSaved = profile().bigFive.E === 'high';
        res.traitShown = $p('[data-emo-trait="E"].et-emo-seg-on').text() === 'High';
        // Morality: under the Big Five, only with NSFW on
        settings.nsfwEnabled = true;
        click('[data-emo-tab="personality"]');
        res.moralityRow = rows().map(r => r.querySelector('.et-emo-label').textContent).pop() === 'Morality';
        click('[data-emo-trait="morality"][data-emo-level="low"]');
        res.moralitySaved = profile().morality === 'low' && $p('[data-emo-trait="morality"].et-emo-seg-on').text() === 'Low';
        settings.nsfwEnabled = false;
        click('[data-emo-tab="personality"]');
        res.moralityHidden = !$p('[data-emo-trait="morality"]').length;
        click('[data-emo-style-type="example"]');
        const ta = $p('.et-emo-style-text')[0];
        ta.value = 'lol ok\nwait what';
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(500);
        res.styleSaved = profile().textingStyle.type === 'example' && profile().textingStyle.text === 'lol ok\nwait what';
        res.stylePrompt = emo.buildTextingStyleContext('mira.png', 'Mira').includes('<texting_style_reference>');

        // On a computer it sits beside the panel; the header drags it, out of the panel too, but not off the window
        const pop = document.getElementById('et-emotion-popup');
        res.besidePanel = pop.parentNode === panel.parentNode && getComputedStyle(pop).position === 'fixed';
        const head = pop.querySelector('.et-emotion-popup-header');
        const before = { left: pop.offsetLeft, top: pop.offsetTop };
        const mouse = (type, target, x, y) => target.dispatchEvent(new MouseEvent(type, { bubbles: true, button: 0, clientX: x, clientY: y }));
        mouse('mousedown', head, 100, 100);
        mouse('mousemove', document, 70, 140);
        mouse('mouseup', document, 70, 140);
        res.dragMoves = pop.offsetLeft === Math.max(0, before.left - 30) && pop.offsetTop === before.top + 40;
        panel.click();
        await sleep(300);
        res.dragKeepsOpen = !!document.getElementById('et-emotion-popup');
        mouse('mousedown', head, 100, 100);
        mouse('mousemove', document, 5000, 5000);
        mouse('mouseup', document, 5000, 5000);
        const dragged = pop.getBoundingClientRect();
        res.dragLeavesPanel = dragged.right > panel.getBoundingClientRect().right && dragged.right <= innerWidth + 0.5 && dragged.top < innerHeight;
        res.draggableCursor = getComputedStyle(head).cursor === 'grab';
        pop.style.left = `${before.left}px`; pop.style.top = `${before.top}px`;
        await sleep(300);

        // Opens centred on the panel, inside it
        jQuery('#et-emotion-popup').remove();
        open();
        await sleep(300);
        const pr = document.getElementById('et-emotion-popup').getBoundingClientRect();
        const box = panel.getBoundingClientRect();
        res.insidePanel = pr.left >= box.left && pr.right <= box.right + 0.5 && pr.bottom <= box.bottom + 0.5;
        res.saves = saves;
        click('[data-emo-action="close"]');
        await sleep(300);
        res.closed = !document.getElementById('et-emotion-popup');

        // Only the × closes it: not a click outside, nor opening it again
        open();
        await sleep(100);
        statusRow().click();
        panel.click();
        document.body.click();
        open();
        await sleep(300);
        res.outsideKeepsOpen = jQuery('#et-emotion-popup').length === 1 && !$p('.et-emo-row').closest('.et-emotion-popup-closing').length;
        click('[data-emo-action="close"]');
        await sleep(300);
        res.closedAgain = !document.getElementById('et-emotion-popup');

        const checks = Object.entries(res).filter(([k, v]) => typeof v === 'boolean');
        res.ok = checks.every(([, v]) => v) && res.rowsNsfwOff === 10 && res.rowsNsfwOn === 11 && res.offRows === 0
            && res.groups === 'Relationship,Mood' && res.modeShown === 'Manual'
            && res.traits === 'Extraversion,Agreeableness,Conscientiousness,Openness,Neuroticism';
        return res;
    };

    // Auto mode (docs/emotion-plan.md 3.8): each reply reports changed feelings in a hidden <mood> line
    window.runAutoTest = async function () {
        const res = {};
        jQuery('#et-emotion-popup').remove();
        Object.assign(settings, { characterProfiles: {}, emotionState: {}, nsfwEnabled: false, emotionMode: 'manual' });
        errors.length = 0;
        const chat = () => env.settings.chatHistory['mira.png'];
        const val = id => emo.getEmotionState()[id];
        const shown = id => $p(`[data-emo-dim="${id}"]`).siblings('.et-emo-val').text();
        const flash = id => $p(`[data-emo-dim="${id}"]`).closest('.et-emo-row').find('.et-emo-flash');
        const layout = () => $p('.et-emo-row').toArray().map(row => [...row.children].filter(el => !el.classList.contains('et-emo-flash'))
            .map(el => `${Math.round(el.getBoundingClientRect().left)}:${Math.round(el.getBoundingClientRect().width)}`).join(',')).join('|');
        const rules = () => emo.buildMoodRules('mira.png', { charName: 'Mira', userName: 'Qi' });
        env.settings.chatHistory['mira.png'] = [{ is_user: true, mes: 'hey, you up?', send_date: Date.now() - 60000 }];
        r.renderMessages(chat());
        open();
        click('[data-emo-tab="emotions"]');
        const manualLayout = layout();
        click('[data-emo-mode="auto"]');
        res.autoShown = $p('.et-emo-seg-on').text() === 'Auto';
        res.sameLayoutAsManual = layout() === manualLayout;
        res.firstRule = rules().includes('<mood>joy 60, anger 15</mood>') && rules().includes('In this first report');

        // The model, stubbed: what each reply says, and the chats it was given
        const sent = [];
        let next = '';
        env.buildApiMessagesFromHistory = async h => { sent.push(h.map(m => m.mes).join('\n')); return { apiMessages: [], rawPrompt: '', systemPrompt: '' }; };
        env.requestEchoTextCompletion = async () => next;

        // A reply with a <mood> line: the line is neither shown nor kept; the chat's first report goes straight there
        next = 'yeah\ncan\'t sleep\n<mood>joy 60, anticipation 40</mood>';
        await r.generateEchoText(chat());
        const first = chat()[chat().length - 1];
        res.lineTakenOut = first.mes === 'yeah\ncan\'t sleep';
        res.moodKept = JSON.stringify(first.mood) === '{"joy":60,"anticipation":40}';
        res.notShown = panel.textContent.includes('can\'t sleep') && !panel.textContent.includes('mood>') && !panel.textContent.includes('joy 60');
        res.valuesMoved = val('joy') === 60 && val('anticipation') === 40;
        res.statusJoy = statusRow().textContent === 'Joy';
        res.burstChips = jQuery('#et-emo-burst .et-emo-burst-chip').length === 2;
        res.popupRedrawn = shown('joy') === '60';
        res.flashShown = flash('joy').hasClass('et-emo-flash-up') && flash('joy').text() === '60' && flash('anticipation').text() === '40' && $p('.et-emo-flash').length === 2;
        res.flashTakesNoRoom = layout() === manualLayout;
        const valBox = $p('[data-emo-dim="joy"]').siblings('.et-emo-val')[0].getBoundingClientRect();
        res.flashRightOfValue = flash('joy')[0].getBoundingClientRect().left >= valBox.right - 1;
        await sleep(3500);
        res.flashFades = !$p('.et-emo-flash').length;
        click('[data-emo-action="close"]');
        await sleep(300);
        open();
        res.flashOnOpen = flash('joy').text() === '60' && flash('anticipation').text() === '40';
        await sleep(3500);
        res.flashOnOpenFades = !$p('.et-emo-flash').length;
        res.ruleNotFirst = !rules().includes('first report') && rules().includes('joy 60');

        // The next report moves a feeling 25 at most (Neuroticism mid); the model never sees a <mood> line
        next = '<mood>joy 100, anger 90</mood>\nok wait';
        await r.generateEchoText([...chat(), { is_user: true, mes: 'same lol', send_date: Date.now() }]);
        res.capped = val('joy') === 85 && val('anger') === 25;
        res.flashes = flash('anger').text() === '25' && flash('joy').text() === '25' && !flash('anticipation').length;
        res.contextClean = sent.length === 2 && sent.every(text => !text.includes('<mood'));

        // A new version of the reply brings its own report; going back to the first brings that one back
        env.settings.swipedMessages = true;
        const idx = chat().length - 1;
        next = 'nvm\n<mood>sadness 30</mood>';
        await r.generateEchoTextSwipe(chat(), idx, chat().slice(0, idx));
        res.swipeReport = val('joy') === 60 && val('anger') === 0 && val('sadness') === 25 && shown('sadness') === '25';
        const msg = chat()[idx];
        msg.swipeIndex = 0;
        r.syncMsgFromSwipe(msg);
        r.saveChatHistory(chat());
        res.swipeBack = val('joy') === 85 && val('sadness') === 0 && shown('joy') === '85';

        // Deleting the reply takes its report back
        r.saveChatHistory(chat().slice(0, idx));
        res.deleteReverts = val('joy') === 60 && val('anger') === 0 && shown('joy') === '60' && !$p('.et-emo-flash').length;

        // A slider in Auto mode starts over from there: the last reply's changes go, the next report is capped
        await sleep(5);
        slide('joy', 20);
        res.slideKeeps = val('joy') === 20 && val('anticipation') === 40;
        next = 'ok\n<mood>joy 90</mood>';
        await r.generateEchoText(chat());
        res.slideThenCapped = val('joy') === 45;

        // A locked feeling ignores reports, and the rule says it's fixed
        click('[data-emo-lock="anger"]');
        next = 'grr\n<mood>anger 70</mood>';
        await r.generateEchoText([...chat(), { is_user: true, mes: '?', send_date: Date.now() }]);
        res.lockIgnores = val('anger') === 0 && rules().includes('anger 0 (fixed)');
        click('[data-emo-lock="anger"]');

        // Back to Manual: the values stay; no rule, and a stray <mood> line is taken out but not kept
        const before = JSON.stringify(emo.getEmotionState());
        click('[data-emo-mode="manual"]');
        res.manualKeeps = JSON.stringify(emo.getEmotionState()) === before;
        res.manualNoRule = rules() === '';
        next = 'fine\n<mood>joy 100</mood>';
        await r.generateEchoText([...chat(), { is_user: true, mes: '!', send_date: Date.now() }]);
        const last = chat()[chat().length - 1];
        res.manualStrips = last.mes === 'fine' && !('mood' in last) && JSON.stringify(emo.getEmotionState()) === before;

        res.errors = errors.slice();
        click('[data-emo-action="close"]');
        await sleep(300);
        res.ok = Object.values(res).filter(v => typeof v === 'boolean').every(Boolean) && !errors.length;
        return res;
    };

    // Quoted replies (docs/platform-plan.md 9b): Reply from a bubble's menu, the draft
    // above the input, sending, and the character quoting back
    window.runReplyTest = async function () {
        const res = {};
        errors.length = 0;
        const chat = () => env.settings.chatHistory['mira.png'];
        env.settings.chatHistory['mira.png'] = [
            { is_user: true, mes: 'are you free tonight?', send_date: Date.now() - 120000 },
            { is_user: false, mes: 'maybe\n<photo>a ticket</photo>\nlook', send_date: Date.now() - 60000 },
        ];
        r.renderMessages(chat());
        const draft = () => document.getElementById('et-reply-draft');
        const menuItems = (sel, msgIndex, isUser, part) => {
            document.querySelectorAll('.et-dots-menu').forEach(m => m.remove());
            r.toggleDotsMenu(jQuery(document.querySelector(sel)), msgIndex, isUser, part);
            return [...document.querySelectorAll('.et-dots-menu .et-dots-item')];
        };

        // Every bubble's menu starts with Reply; a card is quoted as its note
        const items = menuItems('[data-et-action="part-menu"][data-index="1"][data-part="1"]', 1, false, 1);
        res.replyFirst = items.map(i => i.dataset.action).join(',') === 'reply,copy_part,add_memory,delete';
        res.mainReplyFirst = menuItems('[data-et-action="menu"][data-index="0"]', 0, true, null)[0]?.dataset.action === 'reply';
        menuItems('[data-et-action="part-menu"][data-index="1"][data-part="1"]', 1, false, 1)[0].click();
        res.draftShown = !draft().hidden && draft().querySelector('.et-reply-draft-name')?.textContent === 'Mira'
            && draft().querySelector('.et-reply-draft-text')?.textContent === '[Photo: a ticket]';

        // An empty send keeps it; sending puts the quote in front and clears it
        env.scheduleCharacterReply = () => {};
        env.startCharacterReply = () => {};
        document.getElementById('et-input').value = '';
        r.handleSend();
        res.emptySendKeeps = !draft().hidden && chat().length === 2;
        document.getElementById('et-input').value = 'for us?';
        r.handleSend();
        const sent = chat()[chat().length - 1];
        res.sentWithQuote = sent.is_user && sent.mes === '<reply>Mira: [Photo: a ticket]</reply>\nfor us?';
        res.draftCleared = draft().hidden && !draft().textContent;
        const userQuote = panel.querySelector('[data-et-role="message"][data-index="2"] .et-reply-quote');
        res.userQuoteShown = !!userQuote && userQuote.textContent.includes('[Photo: a ticket]')
            && userQuote.nextElementSibling?.matches('[data-et-role~="bubble"]') && userQuote.nextElementSibling.textContent.includes('for us?');

        // The character quotes the user: the quote sits on the bubble after it
        env.buildApiMessagesFromHistory = async () => ({ apiMessages: [], rawPrompt: '', systemPrompt: '' });
        env.requestEchoTextCompletion = async () => 'hmm\n<reply>我: are you free tonight?</reply>\nyes, obviously';
        await r.generateEchoText(chat());
        const charMsg = panel.querySelector('[data-et-role="message"][data-index="3"]');
        const quotes = charMsg ? [...charMsg.querySelectorAll('.et-reply-quote')] : [];
        res.charQuote = quotes.length === 1 && quotes[0].textContent.includes('are you free tonight?')
            && quotes[0].nextElementSibling?.textContent.includes('yes, obviously');
        res.noRawTag = !panel.textContent.includes('<reply>') && !panel.textContent.includes('reply>');

        // A long quote is cut; another character's chat drops the draft
        chat().push({ is_user: false, mes: 'x'.repeat(200), send_date: Date.now() });
        r.renderMessages(chat());
        r.startReply(chat().length - 1, null);
        const cut = draft().querySelector('.et-reply-draft-text')?.textContent || '';
        res.longQuoteCut = cut.length === 81 && cut.endsWith('…');
        const key = env.getCharacterKey;
        env.getCharacterKey = () => 'other.png';
        r.renderMessages(chat());
        res.otherChatDrops = draft().hidden;
        env.getCharacterKey = key;
        r.startReply(0, null);
        r.clearReplyDraft();
        res.clears = draft().hidden;

        res.errors = errors.slice();
        res.ok = Object.values(res).filter(v => typeof v === 'boolean').every(Boolean) && !errors.length;
        return res;
    };

    // Tapbacks on single bubbles (docs/platform-plan.md 9c): the picker per bubble, the
    // corner badge, room above it with the bubble kept in place, what the model is
    // sent, the former whole-message ones, deleting a bubble, swipes
    window.runTapbackTest = async function () {
        const res = {};
        errors.length = 0;
        const chat = () => env.settings.chatHistory['mira.png'];
        // A long chat, scrolled to the end, so the list can slide what's above
        const filler = Array.from({ length: 14 }, (_, i) => ({ is_user: i % 2 === 0, mes: `line ${i}`, send_date: Date.now() - 600000 + i * 1000 }));
        env.settings.chatHistory['mira.png'] = [...filler,
            { is_user: true, mes: 'how was it?', send_date: Date.now() - 120000 },
            { is_user: false, mes: 'one\ntwo\nthree', send_date: Date.now() - 60000 }];
        const idx = chat().length - 1;
        r.renderMessages(chat());
        const list = document.getElementById('et-messages');
        list.scrollTop = list.scrollHeight;
        await sleep(400);
        const msgEl = () => panel.querySelector(`[data-et-role="message"][data-index="${idx}"]`);
        const bubbles = () => [...msgEl().querySelectorAll('[data-et-role~="bubble"]')];
        const pick = async (part, id) => {
            const btn = bubbles()[part].querySelector('[data-et-action="react"]');
            r.toggleReactOverlay(jQuery(btn), idx, part);
            const emoji = document.querySelector(`.et-react-overlay [data-emoji="${id}"]`);
            const on = emoji.classList.contains('et-overlay-emoji-on');
            emoji.click();
            await sleep(450);
            document.querySelectorAll('.et-react-overlay').forEach(o => o.remove());
            return on;
        };

        // A heart on the first bubble: the badge on its top right, the bubble stays put while the room opens
        const topBefore = bubbles()[0].getBoundingClientRect().top;
        const aboveBefore = msgEl().previousElementSibling.getBoundingClientRect().top;
        await pick(0, 'heart');
        res.stored = JSON.stringify(chat()[idx].bubbleReactions) === '{"0":["heart"]}';
        const badge = bubbles()[0].querySelector('[data-et-role~="tapback"]');
        const b = badge?.getBoundingClientRect(), bb = bubbles()[0].getBoundingClientRect();
        res.badgeTopRight = !!badge && b.top < bb.top && b.right > bb.right - 4 && !bubbles()[1].querySelector('[data-et-role~="tapback"]');
        res.roomAbove = parseFloat(getComputedStyle(bubbles()[0]).marginTop) >= 10;
        res.bubbleKeptInPlace = Math.abs(bubbles()[0].getBoundingClientRect().top - topBefore) <= 1;
        res.aboveSlidUp = msgEl().previousElementSibling.getBoundingClientRect().top < aboveBefore - 5;

        // The picker marks it; the model gets it with a quote of that bubble
        res.pickerMarks = await pick(0, 'heart') === true && !chat()[idx].bubbleReactions;
        await pick(0, 'heart');
        await pick(2, 'fire');
        res.modelText = r.buildUserReactionText(chat()[idx]) === '<react>fire</react>\n<reply>Mira: one</reply>\n<react>heart</react>';

        // Three at most on a bubble
        await pick(2, 'haha');
        await pick(2, 'wow');
        await pick(2, 'star');
        res.limit = JSON.stringify(chat()[idx].bubbleReactions[2]) === '["fire","haha","wow"]';

        // The former whole-message tapbacks sit on the last bubble, and move into the per-bubble store
        delete chat()[idx].bubbleReactions;
        chat()[idx].reactions = { like: { count: 1, mine: true } };
        r.renderMessages(chat());
        res.legacyOnLast = !!bubbles()[2].querySelector('[data-et-role~="tapback"] .fa-thumbs-up');
        await pick(0, 'sad');
        res.legacyMoved = !chat()[idx].reactions && JSON.stringify(chat()[idx].bubbleReactions) === '{"0":["sad"],"2":["like"]}';

        // Deleting the first bubble moves the rest up with their tapbacks
        r.deleteMessagePart(chat(), idx, 0);
        res.deleteShifts = chat()[idx].mes === 'two\nthree' && JSON.stringify(chat()[idx].bubbleReactions) === '{"1":["like"]}';

        // The character's <react> on the user's message: top left of its bubble
        env.buildApiMessagesFromHistory = async () => ({ apiMessages: [], rawPrompt: '', systemPrompt: '' });
        env.requestEchoTextCompletion = async () => 'nice\n<react>heart</react>';
        chat().push({ is_user: true, mes: 'see you', send_date: Date.now() });
        r.renderMessages(chat());
        await r.generateEchoText(chat());
        await sleep(450);
        const userBubble = panel.querySelector(`[data-et-role="message"][data-index="${chat().length - 2}"] [data-et-role~="bubble"]`);
        const ub = userBubble.querySelector('[data-et-role~="tapback"]')?.getBoundingClientRect(), ubb = userBubble.getBoundingClientRect();
        res.charTapbackTopLeft = !!ub && ub.top < ubb.top && ub.left < ubb.left + 4 && !userBubble.querySelector('[data-et-role~="tapback"]').hasAttribute('data-et-action');

        res.errors = errors.slice();
        res.ok = Object.values(res).filter(v => typeof v === 'boolean').every(Boolean) && !errors.length;
        return res;
    };

    // Memories (docs/platform-plan.md 10a): Add Memory on every bubble with keywords, the
    // settings panel (settings.html as shipped) adding and editing them, and its list
    // marking what the last prompt carried
    const memoryChat = () => [
        { is_user: true, mes: '我知道你是谁', send_date: Date.now() - 120000, memoryHighlights: [{ text: '你是谁', category: 'custom', label: 'x' }] },
        { is_user: false, mes: '哈？\n我在便利店上夜班\nlook', send_date: Date.now() - 60000 },
    ];
    const bubbleMenu = (sel, msgIndex, isUser, part) => {
        document.querySelectorAll('.et-dots-menu').forEach(m => m.remove());
        r.toggleDotsMenu(jQuery(document.querySelector(sel)), msgIndex, isUser, part);
        return [...document.querySelectorAll('.et-dots-menu .et-dots-item')];
    };
    let settingsModal = null;
    async function mountSettingsPanel() {
        const host = document.createElement('div');
        host.id = 'settings-host';
        host.innerHTML = await (await fetch('../../settings.html')).text();
        document.body.appendChild(host);
        window._etGetCharacterKey = () => 'mira.png';
        window._etGetCharacterName = () => 'Mira';
        window._etGetRecalledMemoryIds = () => env.memorySystem.getRecalledIds();
        window._etGetChatSummaries = r.getChatSummariesForList;
        window._etSetChatSummary = r.setChatSummary;
        // Once: it binds its handlers on the document
        const sm = settingsModal || (settingsModal = window.EchoTextSettingsModal.createSettingsModal({ getSettings: () => env.settings, saveSettings: () => {} }));
        const render = () => sm.renderMemoryListInto('#et_memory_list_panel', '#et_memory_empty_panel', '#et_memory_list_label_panel');
        render();
        return { host, render };
    }

    window.runMemoryTest = async function () {
        const res = {};
        errors.length = 0;
        const mems = () => env.settings.characterMemories?.['mira.png'] || [];
        env.settings.characterMemories = {};
        env.settings.chatHistory['mira.png'] = memoryChat();
        r.renderMessages(env.settings.chatHistory['mira.png']);

        // Every bubble's menu has Add Memory, after Copy; old highlight marks are gone
        const part = '[data-et-action="part-menu"][data-index="1"][data-part="1"]';
        res.partMenu = bubbleMenu(part, 1, false, 1).map(i => i.dataset.action).join(',') === 'reply,copy_part,add_memory,delete';
        res.userMenu = bubbleMenu('[data-et-action="menu"][data-index="0"]', 0, true, null).some(i => i.dataset.action === 'add_memory');
        res.noMarks = !panel.querySelector('mark');

        // It saves that bubble's words, with the keywords typed
        bubbleMenu(part, 1, false, 1).find(i => i.dataset.action === 'add_memory').click();
        res.modalText = jQuery('#et-mem-save-content-edit').val() === '我在便利店上夜班';
        jQuery('#et-mem-save-modal .et-mem-save-keys').val('夜班， 便利店');
        jQuery('#et-mem-save-confirm').trigger('click');
        res.saved = mems().length === 1 && mems()[0].content === '我在便利店上夜班' && JSON.stringify(mems()[0].keys) === '["夜班","便利店"]';
        await sleep(300);
        // The main menu saves the last bubble
        bubbleMenu('[data-et-action="menu"][data-index="1"]', 1, false, null).find(i => i.dataset.action === 'add_memory').click();
        res.mainSavesLast = jQuery('#et-mem-save-content-edit').val() === 'look';
        jQuery('#et-mem-save-dismiss').trigger('click');
        await sleep(300);

        // The settings panel: no highlight controls; adding with keywords
        const { host, render } = await mountSettingsPanel();
        res.noHighlightControls = !host.querySelector('#et_memory_auto_extract_panel, .et-mem-hl-btn');
        jQuery('#et_memory_form_content_panel').val('齐宁怕黑');
        jQuery('#et_memory_form_keys_panel').val('黑, 夜路');
        jQuery('#et_memory_form_save_panel').trigger('click');
        res.panelAdd = mems().length === 2 && mems()[0].content === '齐宁怕黑' && JSON.stringify(mems()[0].keys) === '["黑","夜路"]'
            && !jQuery('#et_memory_form_keys_panel').val();
        const card = content => [...host.querySelectorAll('#et_memory_list_panel .et-mem-card')].find(c => c.querySelector('.et-mem-card-content').textContent === content);

        // What the last prompt carried is marked: small talk brings nothing, a keyword the shift
        env.memorySystem.buildMemoryContext(['在干嘛', '你在哪上班']);
        render();
        res.noneMarked = !host.querySelector('.et-mem-recalled-dot');
        const block = env.memorySystem.buildMemoryContext(['夜班累吗']);
        render();
        res.prompt = block.includes('<shared_memories>') && block.includes('- 我在便利店上夜班') && !block.includes('齐宁怕黑');
        res.marked = !!card('我在便利店上夜班').querySelector('.et-mem-recalled-dot') && !card('齐宁怕黑').querySelector('.et-mem-recalled-dot');
        res.keyChips = [...card('我在便利店上夜班').querySelectorAll('.et-mem-key')].map(k => k.textContent).join(',') === '夜班,便利店';
        // A prompt built for an empty chat (the server plugin's snapshot) leaves the marks
        env.memorySystem.buildMemoryContext([]);
        render();
        res.emptyKeepsMarks = !!card('我在便利店上夜班').querySelector('.et-mem-recalled-dot');

        // Editing the keywords on the card
        card('我在便利店上夜班').querySelector('[data-mem-action="edit"]').click();
        res.editShowsKeys = jQuery(card('我在便利店上夜班')).find('.et-mem-edit-keys').val() === '夜班, 便利店';
        jQuery(card('我在便利店上夜班')).find('.et-mem-edit-keys').val('夜班');
        card('我在便利店上夜班').querySelector('.et-mem-edit-save').click();
        res.edited = JSON.stringify(mems().find(m => m.content === '我在便利店上夜班').keys) === '["夜班"]'
            && card('我在便利店上夜班').querySelectorAll('.et-mem-key').length === 1;

        // Pinned: in every prompt, whatever is said
        card('齐宁怕黑').querySelector('[data-mem-action="pin"]').click();
        res.pinned = env.memorySystem.buildMemoryContext(['hi']).includes('- 齐宁怕黑');
        // Off: nothing in the prompt, no Add Memory
        env.settings.memoryEnabled = false;
        res.off = env.memorySystem.buildMemoryContext(['夜班']) === '';
        res.offHidesMenu = !bubbleMenu(part, 1, false, 1).some(i => i.dataset.action === 'add_memory');
        env.settings.memoryEnabled = true;
        document.querySelectorAll('.et-dots-menu').forEach(m => m.remove());
        host.remove();

        res.errors = errors.slice();
        res.ok = Object.values(res).filter(v => typeof v === 'boolean').every(Boolean) && !errors.length;
        return res;
    };

    // Summaries of a long chat (docs/platform-plan.md 10b): through the real code, the
    // model stubbed — when one is due, what it's asked, where it's kept, what's then sent
    // word for word, the settings list editing and deleting it, off, a failure, a chat
    // that changed while it was written
    window.runSummaryTest = async function () {
        const res = {};
        errors.length = 0;
        const chat = () => env.settings.chatHistory['mira.png'];
        const long = n => Array.from({ length: n }, (_, i) => ({ is_user: i % 2 === 0, mes: i === 1 ? 'hey\n<photo>a ticket</photo>' : `line ${i}`, send_date: Date.now() - (n - i) * 60000 }));
        env.settings.memoryEnabled = true;
        delete env.settings.memorySummaries;
        env.settings.characterMemories = {};
        const asked = [];
        let answer = async () => '```\nSummary: 我和Mira约好周末去看电影\n\nMira送了一张票\n```';
        env.sendCompletionRequest = async req => { asked.push(req); return answer(req); };

        // 89 messages: not yet; 90: the oldest 30
        env.settings.chatHistory['mira.png'] = long(89);
        await r.summarizeOldMessages();
        res.notYet = asked.length === 0 && r.historyToSend(chat()).length === 89;
        chat().push({ is_user: true, mes: 'line 89', send_date: Date.now() });
        await r.summarizeOldMessages();
        const req = asked[0];
        const user = req?.apiMessages?.[1]?.content || '';
        res.asked = asked.length === 1 && /between Mira and 我/.test(req.systemPrompt) && !/Notes so far/.test(user)
            && user.startsWith('Messages:\n我: line 0\nMira: hey / [Photo: a ticket]\n') && user.endsWith('Mira: line 29') && req.rawPrompt === user;
        const memo = chat()[29].memo;
        res.kept = !!memo && memo.text === '我和Mira约好周末去看电影\nMira送了一张票' && memo.count === 30 && chat().filter(m => m.memo).length === 1;
        res.sentAfter = r.historyToSend(chat()).length === 60 && r.historyToSend(chat())[0] === chat()[30];
        await r.summarizeOldMessages();
        res.onlyWhenDue = asked.length === 1;

        // The next chunk carries the notes before it
        for (let i = 90; i < 120; i++) chat().push({ is_user: i % 2 === 0, mes: `line ${i}`, send_date: Date.now() + i });
        await r.summarizeOldMessages();
        res.nextChunk = asked.length === 2 && /^Notes so far \(for context, don't repeat them\):\n我和Mira约好周末去看电影\nMira送了一张票\n\nMessages:\n我: line 30\n/.test(asked[1].apiMessages[1].content)
            && !!chat()[59].memo && r.historyToSend(chat()).length === 60;

        // The settings list: both summaries, editing one, deleting the other
        const { host, render } = await mountSettingsPanel();
        const cards = () => [...host.querySelectorAll('.et-memo-section .et-memo-card')];
        res.listed = !host.querySelector('.et-memo-section').hidden && host.querySelector('.et-memo-section').style.display !== 'none'
            && cards().map(c => c.querySelector('.et-mem-cat-chip').textContent.trim()).join('|') === 'Messages 1–30|Messages 31–60';
        cards()[0].querySelector('[data-memo-action="edit"]').click();
        jQuery(cards()[0]).find('.et-memo-edit-text').val('改过的摘要');
        cards()[0].querySelector('.et-memo-edit-save').click();
        render();
        res.edited = chat()[29].memo.text === '改过的摘要' && cards()[0].querySelector('.et-mem-card-content').textContent === '改过的摘要';
        const del = () => cards()[1].querySelector('[data-memo-action="delete"]');
        del().click();
        res.deleteAsks = !!chat()[59].memo;
        del().click();
        render();
        res.deleted = !chat()[59].memo && cards().length === 1 && r.historyToSend(chat()).length === 90;
        // The prompt: the latest summary marked in the list once a prompt carried it
        env.memorySystem.buildMemoryContext(['hi'], window.EchoTextChatSummaries.summaries(chat()));
        render();
        res.marked = !!cards()[0].querySelector('.et-mem-recalled-dot');
        host.remove();

        // Off: everything in full, nothing asked
        env.settings.memorySummaries = false;
        res.offSendsAll = r.historyToSend(chat()).length === chat().length;
        await r.summarizeOldMessages();
        res.offAsksNothing = asked.length === 2;
        env.settings.memorySummaries = true;

        // A failure waits 10 more messages before trying again
        answer = async () => { throw new Error('down'); };
        await r.summarizeOldMessages();
        res.failed = asked.length === 3 && !chat()[59].memo;
        await r.summarizeOldMessages();
        res.waitsAfterFailure = asked.length === 3;
        for (let i = 0; i < 10; i++) chat().push({ is_user: true, mes: 'more', send_date: Date.now() + 1000 + i });
        answer = async () => 'ok';
        await r.summarizeOldMessages();
        res.retries = asked.length === 4 && chat()[59].memo?.text === 'ok';

        // The last message deleted while the summary was written: it's dropped
        for (let i = 0; i < 30; i++) chat().push({ is_user: false, mes: 'x', send_date: Date.now() + 2000 + i });
        answer = async () => { chat().splice(89, 1); return 'too late'; };
        await r.summarizeOldMessages();
        res.changedChatDropped = asked.length === 5 && !chat().some(m => m.memo?.text === 'too late');

        // A refusal isn't kept as a summary
        answer = async () => '抱歉，我无法总结这段对话。';
        await r.summarizeOldMessages();
        res.refusalNotKept = asked.length === 6 && !chat().some(m => m.memo?.text?.startsWith('抱歉'));

        res.errors = errors.slice();
        res.ok = Object.values(res).filter(v => typeof v === 'boolean').every(Boolean) && !errors.length;
        return res;
    };

    // A screenshot: example values, a lock, Desire with ?nsfw
    const tab = params.get('tab');
    if (tab || params.has('auto')) {
        settings.emotionState['mira.png'] = { start: { ...window.EchoTextEmotionModel.zeroValues(), rapport: -40, joy: 35, anticipation: 55, shock: 10, desire: 30 }, startAt: Date.now() };
        settings.characterProfiles['mira.png'] = { bigFive: { E: 'high', A: 'low', C: 'mid', O: 'mid', N: 'high' }, morality: 'high', locks: { romance: 95 },
            textingStyle: { type: 'instruction', text: 'all lowercase, dry, never uses exclamation marks' } };
        if (params.has('auto')) {
            // The last reply reported more anticipation and less joy
            settings.emotionMode = 'auto';
            const now = Date.now();
            env.settings.chatHistory['mira.png'] = [...history, { is_user: false, mes: 'ok', send_date: now, mood: { anticipation: 75, joy: 20, anger: 30 } }];
            settings.emotionState['mira.png'].startAt = now - 1000;
        }
        statusRow().innerHTML = emo.buildStatusHtml();
        // ?auto without a tab: the reply arriving with the popup closed (the chips under the header)
        if (!tab) emo.noteReport();
        else open();
        if (tab === 'personality') $p('[data-emo-tab="personality"]')[0].click();
    } else if (params.has('report')) {
        const result = await window.runEmotionTest();
        const auto = await window.runAutoTest();
        const reply = await window.runReplyTest();
        const tapback = await window.runTapbackTest();
        const memory = await window.runMemoryTest();
        const summary = await window.runSummaryTest();
        fetch('/__log', { method: 'POST', body: JSON.stringify({ runEmotionTest: result, runAutoTest: auto, runReplyTest: reply, runTapbackTest: tapback, runMemoryTest: memory, runSummaryTest: summary }) }).catch(() => {});
    } else if (params.has('memory')) {
        // Two memories, one pinned, the other in the last prompt; Add Memory open on a bubble
        env.settings.characterMemories = { 'mira.png': [
            { id: 'm1', category: 'custom', label: 'Night shift', content: '我在便利店上夜班', keys: ['夜班', '便利店'], pinned: false },
            { id: 'm2', category: 'person', label: 'Qi', content: '齐宁怕黑，晚上不敢一个人走夜路', keys: [], pinned: true },
        ] };
        // and a summary of earlier messages
        env.settings.chatHistory['mira.png'] = [{ is_user: true, mes: '早', send_date: Date.now() - 900000,
            memo: { id: 'x1', text: '齐宁发现Mira是间谍，Mira没有否认\n两人约好周末在便利店见面', count: 30 } }, ...memoryChat()];
        r.renderMessages(env.settings.chatHistory['mira.png']);
        env.memorySystem.buildMemoryContext(['夜班累吗'], window.EchoTextChatSummaries.summaries(env.settings.chatHistory['mira.png']));
        const { host, render } = await mountSettingsPanel();
        host.style.cssText = 'position:fixed;left:416px;top:10px;width:360px;height:640px;overflow:auto';
        const section = host.querySelector('[data-section="memory"]');
        section.classList.add('open');
        host.querySelectorAll('.et-accordion-section').forEach(sec => { if (sec !== section) sec.style.display = 'none'; });
        jQuery('#et_memory_add_form_panel').show();
        render();
        bubbleMenu('[data-et-action="part-menu"][data-index="2"][data-part="1"]', 2, false, 1).find(i => i.dataset.action === 'add_memory').click();
        // The harness's closeAllDotMenus is a stub
        document.querySelectorAll('.et-dots-menu').forEach(m => m.remove());
    }
    // ?draft=N: Reply picked on message N (its last bubble), the quote waiting above the input
    if (params.has('draft')) r.startReply(Number(params.get('draft')) || 0, null);
    window.__done = true;
})().catch(e => { window.__error = String(e && e.stack || e); console.error(e);
    fetch('/__log', { method: 'POST', body: JSON.stringify({ error: window.__error }) }).catch(() => {}); });
</script>
