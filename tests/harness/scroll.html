<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="build/vendor/css/fontawesome.min.css">
<link rel="stylesheet" href="build/vendor/css/solid.min.css">
<link rel="stylesheet" href="../../style.css">
<style>
    body { background: #1b1d2b; color: #ddd; font-family: sans-serif; margin: 12px; }
    #et-panel { position: relative !important; inset: auto !important; transform: none !important; width: 400px !important; height: 520px !important; display: flex !important; flex-direction: column; opacity: 1 !important; visibility: visible !important; }
    #et-panel .et-panel-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    pre { white-space: pre-wrap; font-size: 11px; }
</style>
</head><body>
<div id="et-panel" class="et-panel"><div class="et-panel-content"><div class="et-messages" id="et-messages" data-et-role="messages"><div class="et-messages-inner" id="et-messages-inner" data-et-role="message-list"></div></div></div></div>
<pre id="log"></pre>
<script src="build/vendor/jquery-3.5.1.min.js"></script>
<script src="build/vendor/purify.min.js"></script>
<script>window.SillyTavern = { libs: { DOMPurify: window.DOMPurify } };</script>
<script src="../../lib/rich-messages.js"></script>
<script src="../../lib/features.js"></script>
<script src="../../lib/stickers.js"></script>
<script src="../../lib/chat-view-model.js"></script>
<script src="../../platforms/echotext/platform.js"></script>
<script src="../../platforms/wechat/platform.js"></script>
<script src="scenarios.js"></script>
<script src="build/bundle-new.js"></script>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
window.runScroll = async function (platform) {
    const t0 = Date.now() - 3600000;
    const history = [];
    for (let i = 0; i < 30; i++) history.push({ is_user: i % 2 === 0, mes: `message ${i} with some words in it`, send_date: t0 + i * 60000 });
    const env = { settings: { ...window.EchoTextScenarios[0].settings, autoScroll: true, defaultPlatform: platform }, groupManager: null,
        FA_REACTIONS: window.EchoTextScenarioReactions, showTypingIndicator: false, BASE_URL: '', VERSION_QUERY: '',
        getCurrentCharacter: () => ({ name: 'Mira' }), getCharacterName: () => 'Mira', isTetheredMode: () => true,
        getUserName: () => 'Me', getCharacterKey: () => 'mira.png', getCharAvatarUrl: () => null, _pickerAvatarBg: () => '#7c6f9c',
        isMobileDevice: () => false, getChatHistory: () => history, getUserAvatarUrl: () => null, isCombinedGroupMode: () => false };
    const r = window.EchoTextHarness.new(env);
    const el = document.getElementById('et-messages');
    r.renderMessages(history);
    await sleep(1200);
    const samples = [`start ${Math.round(el.scrollTop)} / ${el.scrollHeight - el.clientHeight}`];
    const watch = async (label, change) => {
        const startTop = Math.round(el.scrollTop);
        const seen = [];
        let stop = false;
        const tick = () => { seen.push(Math.round(el.scrollTop)); if (!stop) requestAnimationFrame(tick); };
        change();
        seen.push(Math.round(el.scrollTop));
        requestAnimationFrame(tick);
        await sleep(900);
        stop = true;
        samples.push(`${label}: start ${startTop}, lowest ${Math.min(...seen)}, end ${seen[seen.length - 1]} of ${el.scrollHeight - el.clientHeight}, frames ${seen.length}`);
    };
    await watch('user sends', () => { history.push({ is_user: true, mes: 'a new message', send_date: Date.now() }); r.renderMessages(history); });
    await watch('character replies', () => { history.push({ is_user: false, mes: 'reply one\nreply two', send_date: Date.now() - 60000 }); r.renderMessages(history); });
    await watch('another chat (full render)', () => { history.push({ is_user: true, mes: 'x', send_date: Date.now() }); env.settings.defaultPlatform = platform === 'wechat' ? 'echotext' : 'wechat'; r.renderMessages(history); });
    return samples.join(' | ');
};
</script>
</body></html>
